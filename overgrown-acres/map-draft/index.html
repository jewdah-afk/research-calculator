<title>Overgrown Acres Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D forest; a field-journal HUD floats over it (title top-left, controls right, minimap bottom-left, place card bottom-right). Single dark "night in the woods" look. */
:root {
  --bg: #0c110c;
  --panel: rgba(16, 22, 16, 0.84);
  --panel-solid: #141b14;
  --line: rgba(196, 214, 160, 0.16);
  --paper: #ece5cf;
  --muted: #a9ae96;
  --moss: #a7c26f;
  --moss-deep: #5f7a3a;
  --ember: #e98a4b;
  --root: #c65bd6;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--paper);
  font-family: var(--body); font-size: 14px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud { position: fixed; z-index: 10; }
.glass {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

/* Title */
#title { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; padding: 12px 16px 12px; max-width: min(360px, calc(100vw - 32px)); }
#title h1 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
#title p { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
#title .state-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--moss); }
#title .state-tag i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

/* Controls */
#right { top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 320px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
#right > * { pointer-events: auto; }
#controls { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 14px; display: grid; gap: 14px; }
.section { display: grid; gap: 8px; }
.label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.label output { color: var(--paper); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button, .btn {
  font: 600 12.5px/1.2 var(--body); color: var(--paper); background: rgba(255,255,255,0.04);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px; cursor: pointer; text-align: left;
  display: grid; gap: 2px;
}
.seg button small { font-weight: 400; font-size: 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: rgba(167, 194, 111, 0.16); border-color: var(--moss); }
.seg button[data-state="defense"][aria-pressed="true"] { background: rgba(198, 91, 214, 0.16); border-color: var(--root); }
.seg button:hover, .btn:hover { border-color: rgba(196,214,160,0.4); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
input[type="range"] { width: 100%; accent-color: var(--moss); }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.toggles label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; }
.toggles input { accent-color: var(--moss); margin: 0; }
select { width: 100%; font: 500 13px var(--body); color: var(--paper); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
#toggle-controls { display: none; }

/* Minimap */
#minimap { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 8px; }
#minimap canvas { display: block; width: 188px; height: 188px; border-radius: 8px; cursor: crosshair; }
#minimap .scale { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
#minimap .scale span { display: block; height: 4px; border: 1px solid var(--muted); border-top: 0; width: 47px; }

/* Place card */
#card { position: relative; margin-top: auto; flex: 0 1 auto; min-height: 120px; overflow-y: auto; padding: 16px 18px 16px; }
#card .eyebrow { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--moss); }
#card h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 4px 0 8px; line-height: 1.05; text-wrap: balance; }
#card blockquote { margin: 0 0 10px; padding: 0 0 0 12px; border-left: 2px solid var(--moss-deep); font-family: var(--display); font-style: italic; font-size: 15.5px; color: var(--paper); line-height: 1.4; }
#card h3 { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 12px 0 6px; font-weight: 400; }
#card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; color: #d9d4bf; }
#card .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--paper); cursor: pointer; font-size: 16px; }
#card .dims { font-family: var(--mono); font-size: 11.5px; color: var(--ember); margin-top: 2px; }

/* 3D labels */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.poi {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 0; color: var(--paper);
}
.poi b { font: 600 12px/1 var(--body); background: rgba(12,17,12,0.78); border: 1px solid var(--line); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.poi.later b { color: var(--muted); font-style: italic; font-family: var(--display); font-weight: 400; font-size: 13px; }
.poi.danger b { border-color: var(--root); color: #f1c9f6; }
.poi i { width: 1px; height: 14px; background: linear-gradient(var(--paper), transparent); }
.poi:hover b, .poi:focus-visible b { border-color: var(--moss); }

/* Walk hint + joystick */
#hint { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 8px 14px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
#hint kbd { font-family: var(--mono); font-size: 11px; color: var(--paper); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; }
#joystick { display: none; right: 24px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--line); background: rgba(12,17,12,0.4); touch-action: none; }
#joystick span { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(167,194,111,0.35); border: 1px solid var(--moss); }

#loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); font-family: var(--display); font-size: 22px; color: var(--muted); font-style: italic; }

@media (max-width: 760px) {
  #title { padding: 10px 12px; max-width: calc(100vw - 110px); }
  #title h1 { font-size: 22px; }
  #title p { display: none; }
  #toggle-controls { display: block; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; padding: 10px 12px; font: 600 13px var(--body); color: var(--paper); cursor: pointer; }
  #right { top: calc(66px + env(safe-area-inset-top, 0px)); left: 16px; width: auto; bottom: calc(146px + env(safe-area-inset-bottom, 0px)); }
  #controls.collapsed { display: none; }
  #minimap canvas { width: 120px; height: 120px; }
  #minimap .scale { display: none; }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="stage"></div>
<div id="labels"></div>

<header id="title" class="hud glass">

  <p>Starter map rough draft: the old road, the cabin, the shed, the garden, the trail and the campsite. The later zones are sketched in the distance.</p>

</aside>

</article>
</div>

</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Scale: 1 unit = 2.5 Roblox studs (the avatar is 2 units = 5 studs tall).
// North is -Z. The road enters from the south.
// ---------------------------------------------------------------------------
const STUDS = 2.5;
const HALF = 160;
const CABIN = new THREE.Vector3(-6, 0, 44);
const SHED = new THREE.Vector3(13, 0, 35);
const GARDEN = new THREE.Vector3(6, 0, 60);
const PUMP = new THREE.Vector3(17, 0, 62);
const CAMP = new THREE.Vector3(8, 0, -80);
const ORCHARD = new THREE.Vector3(-108, 0, -42);
const MOSSY = new THREE.Vector3(108, 0, -20);
const GLASSHOUSE = new THREE.Vector3(-100, 0, -140);
const CLEARING = new THREE.Vector3(2, 0, 50);

// ---------- seeded random + noise ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(20260928);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
function fbm(x, z, oct = 4) { let s = 0, amp = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); f *= 2.03; amp *= 0.5; } return s; }
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- paths ----------
const P = (x, z) => new THREE.Vector2(x, z);
const PATHS = [
  { id: 'road', width: 3.4, pts: [P(0, 165), P(1, 130), P(-1, 100), P(0, 76), P(-2, 60)] },
  { id: 'door', width: 1.6, pts: [P(-2, 60), P(-4.5, 50.5)] },
  { id: 'trail', width: 1.7, pts: [P(0, 36), P(2, 22), P(-2, 6), P(-3, -10), P(1, -28), P(5, -46), P(7, -60)] },
  { id: 'orchard', width: 1.3, overgrown: true, pts: [P(-3, -10), P(-24, -16), P(-52, -24), P(-80, -34), P(-96, -40)] },
  { id: 'mossy', width: 1.4, pts: [P(22, -84), P(46, -76), P(72, -58), P(94, -34)] },
  { id: 'hidden', width: 0.9, overgrown: true, pts: [P(-116, -58), P(-118, -84), P(-110, -110), P(-102, -128)] },
];
function segDist(px, pz, a, b) {
  const abx = b.x - a.x, abz = b.y - a.y; const t = Math.max(0, Math.min(1, ((px - a.x) * abx + (pz - a.y) * abz) / (abx * abx + abz * abz)));
  const dx = px - (a.x + abx * t), dz = pz - (a.y + abz * t); return Math.sqrt(dx * dx + dz * dz);
}
function pathInfo(x, z) {
  let best = { d: 1e9, path: null };
  for (const p of PATHS) for (let i = 0; i < p.pts.length - 1; i++) {
    const d = segDist(x, z, p.pts[i], p.pts[i + 1]) - p.width;
    if (d < best.d) best = { d, path: p };
  }
  return best;
}

// ---------- terrain height ----------
const FLATS = [
  { c: CLEARING, r: 30, h: 0 },
  { c: CAMP, r: 24, h: 0.6 },
  { c: ORCHARD, r: 42, h: 1.2 },
];
function zoneWeights(x, z) {
  const d = (v) => Math.hypot(x - v.x, z - v.z);
  return {
    mossy: 1 - smooth(30, 62, d(MOSSY)),
    orchard: 1 - smooth(34, 56, d(ORCHARD)),
    thorn: 1 - smooth(18, 40, Math.min(d(GLASSHOUSE), Math.hypot(x + 112, z + 100))),
    clearing: 1 - smooth(22, 34, d(CLEARING)),
    camp: 1 - smooth(16, 26, d(CAMP)),
  };
}
function heightAt(x, z) {
  let h = fbm(x * 0.012, z * 0.012) * 9 + fbm(x * 0.045 + 7, z * 0.045 - 3, 3) * 1.6;
  // mountains ringing the map
  const edge = Math.max(Math.abs(x), Math.abs(z));
  h += smooth(125, 158, edge) * (18 + fbm(x * 0.03, z * 0.03) * 10);
  // Mossy Hollow is a damp bowl
  const dm = Math.hypot(x - MOSSY.x, z - MOSSY.z);
  h -= (1 - smooth(8, 58, dm)) * 7;
  for (const f of FLATS) {
    const w = 1 - smooth(f.r * 0.6, f.r * 1.25, Math.hypot(x - f.c.x, z - f.c.z));
    h = lerp(h, f.h + fbm(x * 0.05, z * 0.05, 2) * 0.35, w);
  }
  const pi = pathInfo(x, z);
  const pw = 1 - smooth(0, 7, pi.d);
  h = lerp(h, fbm(x * 0.006, z * 0.006) * 6 + (pi.path && pi.path.id === 'road' ? 0 : 0.3), pw * 0.55);
  return h;
}

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9fb49a, 0.007);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(70, 95, 150);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 330;
controls.screenSpacePanning = false;

const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x3b4a2a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 400 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x8fa8ff, 0);
scene.add(moon, moon.target);

// ---------- materials ----------
const matCache = new Map();
function M(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, flatShading: true, ...o }));
  return matCache.get(key);
}
const nightGlow = []; // materials whose emissive follows night
function glowMat(color, emissive, base = 0, night = 1.4) {
  const m = new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: base, roughness: 0.6, flatShading: true });
  nightGlow.push({ m, base, night });
  return m;
}

function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, color, x, y, z, parent, o) => mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'object' ? color : M(color, o), x, y, z, parent);
const cyl = (rt, rb, h, color, x, y, z, parent, seg = 8) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), typeof color === 'object' ? color : M(color), x, y, z, parent);
function group(x = 0, y = 0, z = 0, parent = scene, rotY = 0) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY; parent.add(g); return g; }
function ground(x, z, parent) { return group(x, heightAt(x, z), z, parent); }

// ---------- story-state visibility ----------
const STATES = ['day1', 'settled', 'defense', 'after'];
const tagged = [];
function only(obj, states) { tagged.push({ obj, states }); return obj; }
let storyState = 'day1';

// ---------- canvas textures ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function signTex(text, bg = '#6b4a2b', fg = '#efe2c2') {
  return canvasTex(256, 96, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.08})`; g.fillRect(0, i * 16 + 4, w, 2); }
    g.fillStyle = fg; g.font = 'bold 44px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 2);
  });
}

// ===========================================================================
// TERRAIN
// ===========================================================================
const COLORS = {
  grass: new THREE.Color(0x5f7d38), grassLight: new THREE.Color(0x7e9a48), forest: new THREE.Color(0x3a5226),
  dirt: new THREE.Color(0x7b6040), dirtDark: new THREE.Color(0x5a4630), moss: new THREE.Color(0x2f6a4c),
  orchard: new THREE.Color(0x8a8c3c), thorn: new THREE.Color(0x4c3530), rock: new THREE.Color(0x6d6a5e), camp: new THREE.Color(0x7a8a4a),
};
function groundColor(x, z, h) {
  const w = zoneWeights(x, z);
  const n = fbm(x * 0.08, z * 0.08, 2);

}
$('card-close').addEventListener('click', () => { $('card').hidden = true; });

// camera flights
let flight = null;
function flyTo(target, offset, dur = 1.4) {

}
function focusPlace(id, instant = false) {

// story state
const stateNames = { day1: 'Day 1: Overgrown', settled: 'Settled: Repaired & planted', defense: 'Defense night', after: 'After the Glasshouse' };
function setState(s) {

  $('state-tag').querySelector('span').textContent = stateNames[s];
  $('state-tag').style.color = s === 'defense' ? 'var(--root)' : 'var(--moss)';

}
document.querySelectorAll('#state-seg button').forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));

// time of day
let timeOfDay = 14;
const skyDay = { top: new THREE.Color(0x6fa3d8), bottom: new THREE.Color(0xd4e2cf), fog: new THREE.Color(0xa9bca2) };
const skyDusk = { top: new THREE.Color(0x3b4f86), bottom: new THREE.Color(0xe79a62), fog: new THREE.Color(0x8a7a6a) };
const skyNight = { top: new THREE.Color(0x070b18), bottom: new THREE.Color(0x17202a), fog: new THREE.Color(0x0e141a) };
function setTime(h) {
  timeOfDay = h; $('time').value = h;
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  $('time-out').textContent = `${String(hh % 24).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
$('time').addEventListener('input', (e) => setTime(parseFloat(e.target.value)));
function applyLighting() {
  const elev = Math.sin(((timeOfDay - 6) / 12) * Math.PI); // 1 at noon, -1 at midnight
  const day = smooth(-0.1, 0.35, elev), dusk = (1 - Math.abs(elev) / 0.35) * (elev > -0.35 ? 1 : 0);
  const d = Math.max(0, Math.min(1, dusk));
  const top = skyNight.top.clone().lerp(skyDay.top, day).lerp(skyDusk.top, d * 0.6);
  const bottom = skyNight.bottom.clone().lerp(skyDay.bottom, day).lerp(skyDusk.bottom, d * 0.8);
  const fogC = skyNight.fog.clone().lerp(skyDay.fog, day).lerp(skyDusk.fog, d * 0.6);
  if (storyState === 'defense') { top.lerp(new THREE.Color(0x1a0b22), 0.6); fogC.lerp(new THREE.Color(0x1c1024), 0.6); }
  sky.material.uniforms.top.value.copy(top); sky.material.uniforms.bottom.value.copy(bottom);
  scene.fog.color.copy(fogC);
  const az = ((timeOfDay - 6) / 12) * Math.PI;
  const focus = controls.target;
  sun.position.set(focus.x + Math.cos(az) * 120, focus.y + Math.max(elev, 0.05) * 160, focus.z + 60);
  sun.target.position.copy(focus);
  sun.intensity = 2.4 * day + 0.6 * d;
  sun.color.setHex(d > 0.4 ? 0xffb780 : 0xfff1d6);
  moon.position.set(focus.x - 60, focus.y + 120, focus.z - 40); moon.target.position.copy(focus);
  moon.intensity = (1 - day) * 0.8;
  hemi.intensity = 0.38 + day * 0.62;
  hemi.color.copy(top).lerp(new THREE.Color(0xffffff), 0.4);
  const night = 1 - day;
  nightGlow.forEach(({ m, base, night: n }) => { m.emissiveIntensity = base + (n - base) * night; });
  fireLight.intensity = 10 + night * 30;
  fireflies.points.material.opacity = night * 0.95;
  shafts.visible = day > 0.6;
  moonDisc.visible = night > 0.3;
  moonDisc.position.set(camera.position.x - 250, 230, camera.position.z - 300); moonDisc.lookAt(camera.position);
  renderer.toneMappingExposure = 0.85 + day * 0.25 + night * 0.25;
}

// layers
$('layer-labels').addEventListener('change', (e) => { labelsEl.hidden = !e.target.checked; });
$('layer-roof').addEventListener('change', (e) => { roof.visible = e.target.checked; });
$('layer-markers').addEventListener('change', (e) => { markers.visible = e.target.checked; });
// X-ray view: the ground turns see-through and everything above the lab steps aside.

  grassMeshes.forEach((g) => { g.visible = false; });
}
function setBasement(on) {
  basement.visible = on;
  if (on) applyBasementHide();
  else { cabin.children.forEach((c) => { c.visible = true; }); grassMeshes.forEach((g) => { g.visible = true; }); roof.visible = $('layer-roof').checked; tagged.forEach(({ obj, states }) => { obj.visible = states.includes(storyState); }); }
  cellarHinges.forEach((h) => { h.rotation.x = on ? h.userData.side * 1.9 : 0; });
  cellarHinges.lock.visible = !on;
  const m = terrainMesh.material; m.transparent = on; m.opacity = on ? 0.28 : 1; m.depthWrite = !on; m.needsUpdate = true;
}
$('layer-basement').addEventListener('change', (e) => setBasement(e.target.checked));
$('layer-roots').addEventListener('change', (e) => { rootNet.visible = e.target.checked || storyState === 'after'; });

// phone: collapsible controls
const ctl = $('controls');
if (window.matchMedia('(min-width: 761px)').matches) ctl.classList.remove('collapsed');
$('toggle-controls').addEventListener('click', () => { const c = ctl.classList.toggle('collapsed'); $('toggle-controls').setAttribute('aria-expanded', String(!c)); });

// ===========================================================================
// WALK MODE
// ===========================================================================
const avatar = person({ shirt: 0x3f6f9a, pants: 0x2e3440, hat: 0xa8452e }, scene, 0, 128, Math.PI);
avatar.position.y = heightAt(0, 128);
avatar.visible = false;
let mode = 'orbit';
const keys = new Set();
const joy = { x: 0, y: 0 };
function setMode(m) {
  mode = m;
  document.querySelectorAll('#mode-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  avatar.visible = m === 'walk';
  const touch = matchMedia('(pointer: coarse)').matches;
  $('joystick').style.display = m === 'walk' && touch ? 'block' : 'none';
  $('hint').innerHTML = m === 'walk'
    ? '<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · drag to look'
    : 'Drag to orbit · right-drag to pan · scroll to zoom · click a label to travel';
  if (m === 'walk') {
    flight = null;
    controls.minDistance = 5; controls.maxDistance = 30;
    controls.target.copy(avatar.position).add(new THREE.Vector3(0, 2, 0));
    camera.position.copy(controls.target).add(new THREE.Vector3(0, 5, 11));
  } else { controls.minDistance = 4; controls.maxDistance = 330; }
}
document.querySelectorAll('#mode-seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; keys.add(e.code); });
addEventListener('keyup', (e) => keys.delete(e.code));
{
  const j = $('joystick'), knob = j.querySelector('span'); let id = null;
  const move = (e) => { const r = j.getBoundingClientRect(); let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2); const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } joy.x = x; joy.y = y; knob.style.transform = `translate(${x * 36}px, ${y * 36}px)`; };
  j.addEventListener('pointerdown', (e) => { id = e.pointerId; j.setPointerCapture(id); move(e); });
  j.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
  const end = () => { id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  j.addEventListener('pointerup', end); j.addEventListener('pointercancel', end);
}
let walkPhase = 0;
function updateWalk(dt) {
  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) s -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) s += 1;
  f -= joy.y; s += joy.x;
  const len = Math.hypot(f, s);
  const { legs, arms } = avatar.userData;
  if (len > 0.05) {
    const fwd = new THREE.Vector3().subVectors(controls.target, camera.position).setY(0).normalize();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
    const dir = fwd.multiplyScalar(f).add(right.multiplyScalar(s)).normalize();
    const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 16 : 8) * Math.min(len, 1);
    const nx = THREE.MathUtils.clamp(avatar.position.x + dir.x * speed * dt, -HALF + 8, HALF - 8);
    const nz = THREE.MathUtils.clamp(avatar.position.z + dir.z * speed * dt, -HALF + 8, HALF - 8);
    const delta = new THREE.Vector3(nx - avatar.position.x, 0, nz - avatar.position.z);
    avatar.position.x = nx; avatar.position.z = nz;
    const ny = heightAt(nx, nz) + (isInsideCabin(nx, nz) ? FLOOR : 0);
    delta.y = ny - avatar.position.y; avatar.position.y = ny;
    camera.position.add(delta); controls.target.add(delta);
    avatar.rotation.y = Math.atan2(dir.x, dir.z);
    walkPhase += dt * speed * 1.1;
  } else walkPhase *= 0.85;
  const sw = Math.sin(walkPhase) * 0.7 * Math.min(1, len + 0.001);
  legs[0].rotation.x = sw; legs[1].rotation.x = -sw; arms[0].rotation.x = -sw; arms[1].rotation.x = sw;
}
function isInsideCabin(x, z) { return Math.abs(x - CABIN.x) < CW / 2 && Math.abs(z - CABIN.z) < CD / 2; }

// ===========================================================================
// MINIMAP
// ===========================================================================
const mm = $('minimap-canvas'), mctx = mm.getContext('2d');
const MM = mm.width;
const toMM = (x, z) => [(x + HALF) / (HALF * 2) * MM, (z + HALF) / (HALF * 2) * MM];
const mmBase = document.createElement('canvas'); mmBase.width = mmBase.height = MM;
{
  const g = mmBase.getContext('2d'); const img = g.createImageData(MM, MM);
  for (let j = 0; j < MM; j++) for (let i = 0; i < MM; i++) {
    const x = i / MM * HALF * 2 - HALF, z = j / MM * HALF * 2 - HALF; const h = heightAt(x, z);
    const c = groundColor(x, z, h); const shade = 0.75 + Math.min(0.35, Math.max(-0.2, h * 0.02));
    const k = (j * MM + i) * 4;
    img.data[k] = Math.min(255, Math.pow(c.r, 1 / 2.2) * 255 * shade); img.data[k + 1] = Math.min(255, Math.pow(c.g, 1 / 2.2) * 255 * shade); img.data[k + 2] = Math.min(255, Math.pow(c.b, 1 / 2.2) * 255 * shade); img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // buildings
  g.fillStyle = '#3a2718';
  const rect = (cx, cz, w, d) => { const [x, y] = toMM(cx - w / 2, cz - d / 2); g.fillRect(x, y, w / (HALF * 2) * MM, d / (HALF * 2) * MM); };
  rect(CABIN.x, CABIN.z, CW, CD); rect(SHED.x, SHED.z, 5.4, 4.2);
  g.strokeStyle = '#d8c79a'; g.lineWidth = 1.5; { const [x, y] = toMM(GARDEN.x - GW / 2, GARDEN.z - GD / 2); g.strokeRect(x, y, GW / (HALF * 2) * MM, GD / (HALF * 2) * MM); }
  g.fillStyle = '#ff9a4a'; { const [x, y] = toMM(CAMP.x, CAMP.z); g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
  g.font = '600 15px Figtree, sans-serif'; g.fillStyle = 'rgba(236,229,207,0.92)'; g.textAlign = 'center';
  for (const [t, v] of [['Cabin', CABIN], ['Camp', CAMP], ['Orchard', ORCHARD], ['Hollow', MOSSY], ['Glasshouse', GLASSHOUSE]]) { const [x, y] = toMM(v.x, v.z); g.fillText(t, x, y - 10); }
}
function drawMinimap() {
  mctx.drawImage(mmBase, 0, 0);
  if (rootNet.visible) { mctx.globalAlpha = 0.5; mctx.strokeStyle = '#c65bd6'; mctx.lineWidth = 2; for (const d of [MOSSY, ORCHARD, GLASSHOUSE, CAMP]) { const [a, b] = toMM(GARDEN.x, GARDEN.z), [c, e] = toMM(d.x, d.z); mctx.beginPath(); mctx.moveTo(a, b); mctx.lineTo(c, e); mctx.stroke(); } mctx.globalAlpha = 1; }
  const focus = mode === 'walk' ? avatar.position : controls.target;
  const [x, y] = toMM(focus.x, focus.z);
  const dir = new THREE.Vector3().subVectors(controls.target, camera.position); const a = Math.atan2(dir.z, dir.x);
  mctx.fillStyle = 'rgba(255,241,200,0.18)'; mctx.beginPath(); mctx.moveTo(x, y); mctx.arc(x, y, 34, a - 0.45, a + 0.45); mctx.closePath(); mctx.fill();
  mctx.fillStyle = mode === 'walk' ? '#6fb0ff' : '#fff1c8'; mctx.strokeStyle = '#0c110c'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.arc(x, y, 6, 0, 7); mctx.fill(); mctx.stroke();
}
mm.addEventListener('click', (e) => {
  const r = mm.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * HALF * 2 - HALF, z = (e.clientY - r.top) / r.height * HALF * 2 - HALF;
  if (mode === 'walk') { const d = new THREE.Vector3(x - avatar.position.x, 0, z - avatar.position.z); avatar.position.set(x, heightAt(x, z), z); d.y = 0; camera.position.add(d); controls.target.add(d); controls.target.y = avatar.position.y + 2; camera.position.y = controls.target.y + 5; }
  else flyTo(at(x, z, 0), [20, 26, 30]);
});

// ===========================================================================
// LOOP
// ===========================================================================
const clock = new THREE.Clock();
const v = new THREE.Vector3();
function placeLabel(el, world, maxDist = 260) {
  v.copy(world).project(camera);
  const dist = camera.position.distanceTo(world);
  if (v.z > 1 || dist > maxDist) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.style.transform = `translate(${(v.x * 0.5 + 0.5) * innerWidth}px, ${(-v.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
  el.style.opacity = String(Math.max(0.35, 1 - dist / maxDist));
}
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (flight) {
    flight.t += dt; const k = Math.min(1, flight.t / flight.dur); const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(flight.fromPos, flight.toPos, e); controls.target.lerpVectors(flight.fromTarget, flight.toTarget, e);
    if (k >= 1) flight = null;
  }
  if (mode === 'walk') updateWalk(dt);
  controls.update();
  // keep the camera above ground
  const gh = heightAt(camera.position.x, camera.position.z) + 1.2; if (camera.position.y < gh) camera.position.y = gh;
  // fog thins as the camera climbs so the overview can see every zone
  const alt = camera.position.y - heightAt(camera.position.x, camera.position.z);
  scene.fog.density = lerp(0.011, 0.0022, smooth(10, 120, alt)) * (storyState === 'defense' ? 1.3 : 1);
  applyLighting();
  // fire, embers, fireflies, creatures, breathing plant, root pulse
  flames.forEach((f, i) => { const s = 0.8 + Math.sin(t * 9 + f.phase) * 0.18 + Math.sin(t * 23 + i) * 0.08; f.m.scale.set(s, s * 1.1, s); f.m.position.y = f.base + Math.sin(t * 6 + f.phase) * 0.05; });
  fireLight.intensity *= 0.85 + Math.sin(t * 17) * 0.08 + Math.sin(t * 7.3) * 0.07;
  { const pos = embers.geo.attributes.position; embers.data.forEach((p, i) => { p.t = (p.t + dt * p.sp * 0.35) % 1; pos.setXYZ(i, p.x + Math.sin(p.t * 8 + i) * 0.3 + p.dr * p.t * 2, 0.8 + p.t * 6, p.z + Math.cos(p.t * 6 + i) * 0.3); }); pos.needsUpdate = true; }
  if (fireflies.points.material.opacity > 0.01) { const pos = fireflies.geo.attributes.position; fireflies.data.forEach((p, i) => { pos.setXYZ(i, p.x + Math.sin(t * p.sp + p.ph) * 1.5, p.y + Math.sin(t * p.sp * 1.7 + p.ph) * 0.6, p.z + Math.cos(t * p.sp * 0.8 + p.ph) * 1.5); }); pos.needsUpdate = true; }
  if (defense.visible) creatures.forEach((c) => { c.t = (c.t + dt * c.speed) % 1; const p = c.curve.getPoint(c.t); const n = c.curve.getPoint(Math.min(0.999, c.t + 0.01)); c.g.position.set(p.x, p.y + Math.abs(Math.sin(t * 8 + c.t * 50)) * 0.15, p.z); c.g.lookAt(n.x, p.y, n.z); });
  breathing.forEach((b) => { const s = 1 + Math.sin(t * 0.9) * 0.06; b.scale.set(s, s * 1.03, s); });
  rootNetMat.opacity = 0.35 + Math.sin(t * 1.6) * 0.2;
  defense.children.forEach((c) => { if (c.userData.pulse !== undefined) c.material.opacity = 0.35 + Math.sin(t * 2.4 + c.userData.pulse) * 0.25; });
  // labels
  if (!labelsEl.hidden) {
    PLACES.forEach((p) => { if ((p.basement && !basement.visible) || (basement.visible && (p.id === 'cabin' || p.id === 'inside'))) { p.el.style.display = 'none'; return; } placeLabel(p.el, p.pos, p.later ? 420 : 240); });
    if (storyState === 'defense') placeLabel(dangerLabel, at(CLEARING.x - 38, CLEARING.z - 8, 4)); else dangerLabel.style.display = 'none';
    markerLabels.forEach(({ g, b }) => { if (!markers.visible) { b.style.display = 'none'; return; } placeLabel(b, g.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 3.2, 0)), 120); });
  }
  drawMinimap();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

setState('day1');
setTime(14);
setMode('orbit');
controls.target.set(2, 2, 20);
camera.position.set(62, 70, 110);
$('loading').remove();
animate();
// Open on the cabin clearing with its card.
setTimeout(() => focusPlace('cabin'), 400);
window.__map = { setState, setTime, setMode, focusPlace, setBasement, camera, controls, roof, renderer };
</script>
