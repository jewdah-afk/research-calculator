<meta charset="utf-8">
<title>Peckwood Islands Board</title>
<style>
:root{
  --ink:#0d0f14; --panel:rgba(16,18,26,.80); --line:rgba(255,255,255,.10);
  --fg:#f3f1ea; --dim:#a9afbc; --gold:#ffd27a;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.card{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.title{top:16px;left:16px;padding:14px 18px;max-width:min(330px,calc(100% - 32px))}
.title h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0}
.title h1 span{color:var(--gold)}
.title p{margin:6px 0 0;color:var(--dim);font-size:13px;line-height:1.45}
.side{top:16px;right:16px;bottom:96px;width:290px;padding:12px;display:flex;flex-direction:column;gap:10px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.list button{text-align:left;font-size:13px;padding:7px 9px;display:flex;gap:7px;align-items:center}
.list button i{width:10px;height:10px;border-radius:3px;border:2px solid var(--ink);flex:0 0 auto}
.info{overflow:auto;flex:1;border-top:1px solid var(--line);padding-top:10px}
.info h2{font-family:var(--display);font-size:20px;margin:0}
.info .gate{color:var(--gold);font-size:12px;margin:2px 0 8px}
.info p{font-size:13px;line-height:1.45;margin:0 0 8px;color:#dfe2ea}
.info ul{margin:0;padding-left:16px;font-size:13px;line-height:1.45;color:var(--dim)}
.info b{color:var(--fg)}
.bar{left:16px;right:322px;bottom:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .lbl{color:var(--dim);font-size:12px}
button{font-family:var(--display);font-weight:600;font-size:14px;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
button.go{background:linear-gradient(#9fe07a,#58b03c);color:#0d1a08;border:2px solid var(--ink);box-shadow:0 3px 0 #2f6b1f}
button.go:active{transform:translateY(2px);box-shadow:0 1px 0 #2f6b1f}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tag{position:fixed;transform:translate(-50%,-100%);font-family:var(--display);font-weight:700;font-size:15px;color:#fff;pointer-events:auto;cursor:pointer;white-space:nowrap;
  text-shadow:0 2px 0 var(--ink),0 0 2px var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.tag small{display:block;text-align:center;font-size:11px;color:var(--gold)}
.toast{position:fixed;left:40%;top:20%;transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;font-family:var(--display);font-weight:700;font-size:34px;color:#fff;
  text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);transition:opacity .35s, transform .45s cubic-bezier(.2,1.6,.4,1);text-align:center}
.toast small{display:block;font-size:16px;color:var(--gold)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media (max-width:860px){.side{top:auto;bottom:80px;left:16px;right:16px;width:auto;height:38%}.bar{right:16px}.title{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<aside class="card side">

  <div class="info" id="info"></div>

<div class="card bar">

</div>
<div class="toast" id="toast">THE PARK<small>Island unlocked</small></div>

  const occ=new Set();

  const groundAt=(i,j)=>{i=Math.floor(i);j=Math.floor(j);const v=t(i,j);if(!v)return .3;return v===1||v===4?.3+H[j][i]*BH*1.2:(v===2?.2:-.1)};

  const ctx={W,N,t,edge,s:(i,j,v)=>{if(t(i,j))T[j][i]=v},
    rect(i0,j0,i1,j1,v){for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++)if(t(i,j))T[j][i]=v},
    disc(ci,cj,r,v){for(let j=0;j<N;j++)for(let i=0;i<W;i++)if(t(i,j)&&Math.hypot(i+.5-ci,j+.5-cj)<r)T[j][i]=v},
    ring(rx,ry,w){for(let j=0;j<N;j++)for(let i=0;i<W;i++){const e=Math.hypot((i+.5-cx)/rx,(j+.5-cy)/ry);if(t(i,j)&&Math.abs(e-1)*Math.min(rx,ry)<w/2)T[j][i]=2}},
    cross(w){for(let j=0;j<N;j++)for(let i=0;i<W;i++)if(t(i,j)&&(Math.abs(i+.5-cx)<w/2||Math.abs(j+.5-cy)<w/2))T[j][i]=2},
    lineX(j,i0,i1,v){for(let i=i0;i<=i1;i++)for(const jj of[j,j+1])if(t(i,jj))T[jj][i]=v},
    lineZ(i,j0,j1,v){for(let j=j0;j<=j1;j++)for(const ii of[i-1,i])if(t(ii,j))T[j][ii]=v},

    dune(ci,cj,r){for(let j=0;j<N;j++)for(let i=0;i<W;i++){const e=Math.hypot(i+.5-ci,j+.5-cj)/r;if(T[j][i]===4&&e<1)H[j][i]=e<.5?2:1}},
    spill(i,side){let j=side==='n'?0:N-1;const dir=side==='n'?1:-1;while(j>=0&&j<N&&!t(Math.floor(i),j))j+=dir;spills.push({isl,li:i,side,x:ox+i-cx,z:oz+j+(side==='n'?0:1)-cy,dz:side==='n'?-1:1})},
    put(kind,i,j,rot=0,...a){const g=new THREE.Group();P[kind](g,...a);const [x,z]=C(i-.5,j-.5);const fi=Math.floor(i),fj=Math.floor(j);
      const y=t(fi,fj)===3?-.05:groundAt(fi,fj);g.rotation.y=rot;g.position.set(x,y,z);g.userData={isl,kind,ti:i,tj:j,rot,ty:y,delay:1.7+(pdelay+=.035)};scene.add(g);props.push(g);
      for(let a2=-1;a2<=1;a2++)for(let b=-1;b<=1;b++)occ.add((fi+a2)+','+(fj+b));return g},
    free(i,j){return T[j]&&(T[j][i]===1||T[j][i]===4)&&!occ.has(i+','+j)},
    rim(kind,n,...a){let placed=0;for(let k=0;k<400&&placed<n;k++){const i=Math.floor(hash(k+d.seed*31,7)*W),j=Math.floor(hash(k+d.seed*31,9)*N);const e=edge(i,j);if(e>=1&&e<=2&&ctx.free(i,j)){ctx.put(kind,i+.5,j+.5,0,...(kind==='flowers'?[i,j,...a]:a.length?a:(kind==='tree'||kind==='pine'?[.85+hash(i,j)*.3]:[])));placed++}}},
    scatter(kind,n,...a){let placed=0;for(let k=0;k<400&&placed<n;k++){const i=Math.floor(hash(k+d.seed*53,3)*W),j=Math.floor(hash(k+d.seed*53,5)*N);if(edge(i,j)>=1&&ctx.free(i,j)){ctx.put(kind,i+.5,j+.5,hash(i,j)*6.28,...(kind==='flowers'?[i,j,...a]:a));placed++}}},
    ringProps(rx,ry,kinds,n){for(let k=0;k<n;k++){const a=k/n*6.283+.5;ctx.put(kinds[k%kinds.length],cx+Math.cos(a)*rx,cy+Math.sin(a)*ry)}},

  };

    const v=T[j][i];if(!v)continue;const [x,z]=C(i,j);const h=hash(i+isl*97,j);const ed=edge(i,j);

      const b={isl,x,y:lv*BH*1.2+.15,z,sx:1,sy:.3,sz:1,color:gc,delay:base+.25+lv*.08};bricks.push(b);

// brick bridges between consecutive islands (unlock order)
const bridgeParts=[];
for(let k=0;k<D.length-1;k++){const a=D[k],b=D[k+1];const dx=Math.sign(b.gx-a.gx),dz=Math.sign(b.gz-a.gz);

  const x0=a.ox+dx*(s-1.5),z0=a.oz+dz*(s-1.5),x1=b.ox-dx*(e-1.5),z1=b.oz-dz*(e-1.5);const L=Math.hypot(x1-x0,z1-z0);

// instanced ground

// ---------------------------------------------------------------- build-in per island
const m4=new THREE.Matrix4(),q0=new THREE.Quaternion(),v3=new THREE.Vector3(),s3=new THREE.Vector3();
const easeBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};

// ---------------------------------------------------------------- camera, UI
const OVER_T=new THREE.Vector3(14,-2,4),OVER_P=new THREE.Vector3(14,150,170);

  :`<h2>${d.name}</h2><div class="gate">Unlock: ${d.gate}</div><p>${d.desc}</p><ul>${d.spots.map(s=>`<li>${s}</li>`).join('')}</ul>`}

document.getElementById('replay').onclick=()=>{const k=sel<0?0:sel;islT[k]=REDUCED?END:0;dirty=true;toast.classList.remove('on');toast.innerHTML=`${D[k].name}<small>Island unlocked</small>`;D[k].toastAt=END};

 [15,0x5a9ee6,0xcfe2f2,0xfff4e0,1.05,.58],[17.5,0x6b86c9,0xffc98a,0xffb46b,.8,.46],[18.7,0x48407e,0xf08a6a,0xff8a5c,.3,.34],[20,0x16204a,0x3a3a6e,0x9fb4ff,0,.24],[24,0x0b1230,0x1b2550,0x9fb4ff,0,.22]];

  L(a[3],b[3],sun.color);const si=a[4]+(b[4]-a[4])*t;sun.intensity=Math.max(si,.12);hemi.intensity=a[5]+(b[5]-a[5])*t;hemi.color.copy(skyU.top.value).lerp(WHITE,.55);
  const ang=(hour-6)/12*Math.PI;sunOff.set(-Math.cos(ang)*80,Math.max(Math.sin(ang),.15)*100,-40);if(si<.05)sun.color.setHex(0x9fb4ff);
  night=clamp01((.25-si)/.25);stars.material.opacity=night*.95;ff.material.opacity=night;
  lampMats.forEach(m=>m.emissive.setRGB(night,night*.75,night*.35));glowMats.forEach(m=>{m.emissive.setHex(m.userData.base).multiplyScalar(1+night*1.2)});
  waterMat.emissive.setHex(0x0b2a3a).lerp(new THREE.Color(0x1a2a55),night)}
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hour=+b.dataset.h;applySky();document.querySelectorAll('[data-h]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)))});

// ---------------------------------------------------------------- loop
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
camera.position.set(-60,170,210);controls.target.copy(OVER_T);fly(OVER_P.clone(),OVER_T.clone());camT=0;

const clock=new THREE.Clock();let el=0;const sv=new THREE.Vector3();

  if(building||dirty){applyBuild();dirty=false}
  if(camT<1){camT=Math.min(1,camT+dt/1.4);const e=1-Math.pow(1-camT,3);camera.position.lerpVectors(camFrom.p,camTo.p,e);controls.target.lerpVectors(camFrom.t,camTo.t,e)}

  const dist=camera.position.distanceTo(controls.target);scene.fog.near=dist*.9;scene.fog.far=dist*2.6;

  clouds.forEach(g=>{g.userData.a+=g.userData.sp*dt*(REDUCED?0:6);g.position.set(Math.cos(g.userData.a)*g.userData.r,g.userData.y,Math.sin(g.userData.a)*g.userData.r)});
  for(let k=0;k<wfN;k++){const s=spills[k%spills.length];wfS[k]=(wfS[k]+dt*.55)%1;const f=wfS[k],w=((k*37)%10)/10-.5;
    if(s.dx){wfP[k*3]=s.x-.6-f*1.2+Math.sin(k)*.15;wfP[k*3+2]=s.z+w*1.5}else{wfP[k*3]=s.x+w*3.5;wfP[k*3+2]=s.z+s.dz*(.3+f*1.2)}wfP[k*3+1]=-.1-f*f*14}

  for(let k=0;k<ffN;k++){const s=ffSeed[k];ffP[k*3]=s[0]+Math.sin(el*.7+s[2])*.8;ffP[k*3+1]=1+Math.sin(el*1.3+s[2]*2)*.5;ffP[k*3+2]=s[1]+Math.cos(el*.6+s[2])*.8}ffG.attributes.position.needsUpdate=true;

  const w=innerWidth,h=innerHeight;D.forEach((d,k)=>{v3.copy(d.center);v3.y=9;v3.project(camera);const on=v3.z<1&&(sel<0||sel===k);d.tag.style.display=on?'block':'none';d.tag.style.left=((v3.x+1)/2*w)+'px';d.tag.style.top=((1-v3.y)/2*h)+'px'});
  renderer.render(scene,camera);requestAnimationFrame(frame)}
window.__s={scene,camera,D,bricks,props,spills,bobs,glowMats,lampMats,glass};
requestAnimationFrame(frame);
})();
