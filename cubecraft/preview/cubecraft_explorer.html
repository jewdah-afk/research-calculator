<title>Cube Craft Planet Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen world; a foldable control card top-left; a live stats strip top-right; travel pad bottom-right on touch screens. Single dark UI over a daytime sky. */
:root {
  --sky-top: #5d9fdc;
  --sky-low: #d2ecfa;
  --space: #07101e;
  --panel: rgba(16, 20, 26, 0.86);
  --panel-line: rgba(255, 255, 255, 0.12);
  --ink: #eef2f6;
  --muted: #a9b4c0;
  --grass: #7cc24f;
  --grass-ink: #10200a;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-ui: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-low)); color: var(--ink); font-family: var(--font-ui); }
body.globe { background: radial-gradient(circle at 50% 45%, #12305a 0%, var(--space) 70%); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px;
  width: min(370px, calc(100% - 24px)); box-sizing: border-box; max-height: calc(100% - 90px); overflow-y: auto;
  padding: 14px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
  display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(6px);
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; }
.name span { color: var(--grass); }
.body { display: flex; flex-direction: column; gap: 12px; }
.body[hidden], .busy[hidden], .pad[hidden] { display: none; }
.sub { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--panel-line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--panel-line); }
label { font-size: 13px; color: var(--muted); }
input[type="number"], select {
  min-height: 36px; box-sizing: border-box; padding: 0 10px; font: 500 15px var(--font-ui); color: var(--ink);
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--panel-line); border-radius: 6px; font-variant-numeric: tabular-nums;
}
input[type="number"] { width: 110px; }
select option { background: #1b2028; }
button {
  font: 500 14px/1 var(--font-ui); color: var(--ink); background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--panel-line); border-radius: 6px; min-height: 36px; padding: 0 12px; cursor: pointer;
}
button:hover { background: rgba(255, 255, 255, 0.16); }
button[aria-pressed="true"], button.primary { background: var(--grass); color: var(--grass-ink); border-color: var(--grass); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--grass); outline-offset: 2px; }
.corebox { display: flex; flex-direction: column; gap: 8px; }
.corebox[hidden] { display: none; }
#slice { width: 100%; height: auto; aspect-ratio: 1; border-radius: 6px; background: #05080f; cursor: crosshair; image-rendering: pixelated; }
input[type="range"] { width: 100%; accent-color: var(--grass); }
.cond { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.cond dt { color: var(--muted); }
.cond dd { margin: 0; font-weight: 600; }
body.core { background: radial-gradient(circle at 50% 50%, #2a1408 0%, #07070b 75%); }
.where { margin: 0; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.where b { font-weight: 600; }
.stats {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; margin: 0;
  padding: 8px 10px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 8px;
  font-size: 12px; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; pointer-events: none;
}
.stats b { color: var(--ink); font-weight: 600; }
.hint { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0; text-align: center; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); pointer-events: none; }
.busy { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 22px; color: #eef2f6; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); pointer-events: none; }
.pad { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; }
.pad button { width: 52px; height: 52px; padding: 0; font-size: 20px; background: var(--panel); }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 3; } .pad .fast { grid-column: 2; grid-row: 2; font-size: 12px; }
@media (max-width: 560px) { .stats { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 220px); } }
</style>

<canvas id="scene" aria-label="3D view of the Cube Craft planet"></canvas>
<p class="busy" id="busy">Building the planet…</p>
<section class="card" aria-label="Planet explorer">
  <div class="head">
    <h1 class="name">Cube<span>Craft</span></h1>
    <div class="row">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="m-globe" aria-pressed="false">Globe</button>
        <button type="button" id="m-ground" aria-pressed="true">Ground</button>
        <button type="button" id="m-core" aria-pressed="false">Core</button>
      </div>
      <div class="seg" role="group" aria-label="Globe shape">
        <button type="button" id="s-cube" aria-pressed="true">Cube</button>
        <button type="button" id="s-sphere" aria-pressed="false">Sphere</button>
      </div>
      <button type="button" id="fold" aria-expanded="true">Hide</button>
    </div>
  </div>
  <div class="body" id="body">
    <p class="where" id="where">Finding a place to land…</p>
    <div class="corebox" id="corebox" hidden>
      <canvas id="slice" width="320" height="320" tabindex="0" aria-label="Slice through the middle of the planet showing its layers. Tap a layer to go to that depth."></canvas>
      <label for="depth">Depth below sea level</label>
      <input type="range" id="depth" min="60" max="8192" step="1" value="400">
      <dl class="cond" id="cond"></dl>
    </div>
    <div class="row">
      <label for="size">Size</label>
      <select id="size">
        <option value="2048">2,048 per face</option>
        <option value="4096">4,096 per face</option>
        <option value="8192">8,192 per face</option>
        <option value="16384" selected>16,384 per face</option>
        <option value="32768">32,768 per face</option>
        <option value="65536">65,536 per face</option>
      </select>
    </div>
    <div class="row">
      <label for="seed">Seed</label>
      <input type="number" id="seed" value="1234" inputmode="numeric">
      <button type="button" class="primary" id="go">Generate</button>
      <button type="button" id="rand">Random</button>
    </div>
    <div class="row">
      <label for="dist">View</label>
      <select id="dist">
        <option value="3">Near (phones)</option>
        <option value="5">Medium</option>
        <option value="7">Far</option>
      </select>
      <button type="button" id="xray" aria-pressed="false">Underground</button>
      <button type="button" id="land">New spot</button>
    </div>
    <p class="sub">Globe: drag to spin, tap to land. Ground: drag to look, pinch or scroll to zoom, two fingers or right-drag to move, or use WASD / the arrows. Walk off an edge and you carry on onto the next face.</p>
  </div>
</section>
<p class="stats" id="stats"></p>
<div class="pad" id="pad" hidden>
  <button type="button" class="up" data-dir="up" aria-label="Move forward">↑</button>
  <button type="button" class="left" data-dir="left" aria-label="Move left">←</button>
  <button type="button" class="fast" id="fast" aria-pressed="false" aria-label="Fast travel">×8</button>
  <button type="button" class="right" data-dir="right" aria-label="Move right">→</button>
  <button type="button" class="down" data-dir="down" aria-label="Move back">↓</button>
</div>
<p class="hint" id="hint"></p>

<script id="worker-src" type="text/plain">
// Cube Craft planet generator, v2.
// One deterministic algorithm for the whole cube planet: the same seed gives the same planet on
// every machine, so each player's device can build its own chunks and the server only stores edits.
//
// Geometry: the planet is a cube of faces F x F blocks. Each face owns a truncated pyramid of space
// (a block belongs to the face whose axis it is furthest along), so the six faces fit together with
// no gaps and no doubled blocks, and land continues over every edge. Terrain heights come from noise
// sampled at the point's projection onto the cube surface, so it is seamless across edges.
//
// Performance: columns are cheap (2D climate + height); caves are sampled on a coarse 4-block lattice
// and blended, like Minecraft; ores are placed as small veins (a scatter, not noise on every block).
// Written without JS-only tricks so it ports line for line to Luau (bit32 for the integer ops).
(function (root) {
  "use strict";

  function mulberry32(a) {
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Improved Perlin noise, seeded, with a 1024-entry table (repeats only every 1024 noise units,
  // far larger than any feature on the planet). Output roughly -1..1.
  const PS = 1024, PM = PS - 1;
  function Perlin(seed) {
    const rnd = mulberry32(seed);
    const q = new Uint16Array(PS);
    for (let i = 0; i < PS; i++) q[i] = i;
    for (let i = PS - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = q[i]; q[i] = q[j]; q[j] = t;
    }
    const p = new Uint16Array(PS * 2 + 2);
    for (let i = 0; i < p.length; i++) p[i] = q[i & PM];
    function grad(h, x, y, z) {
      const g = h & 15;
      const u = g < 8 ? x : y;
      const v = g < 4 ? y : (g === 12 || g === 14 ? x : z);
      return ((g & 1) ? -u : u) + ((g & 2) ? -v : v);
    }
    return function (x, y, z) {
      let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
      x -= X; y -= Y; z -= Z;
      X &= PM; Y &= PM; Z &= PM;
      const u = x * x * x * (x * (x * 6 - 15) + 10);
      const v = y * y * y * (y * (y * 6 - 15) + 10);
      const w = z * z * z * (z * (z * 6 - 15) + 10);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
      const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      const x1 = x - 1, y1 = y - 1, z1 = z - 1;
      const a0 = grad(p[AA], x, y, z), a1 = grad(p[BA], x1, y, z);
      const b0 = grad(p[AB], x, y1, z), b1 = grad(p[BB], x1, y1, z);
      const c0 = grad(p[AA + 1], x, y, z1), c1 = grad(p[BA + 1], x1, y, z1);
      const d0 = grad(p[AB + 1], x, y1, z1), d1 = grad(p[BB + 1], x1, y1, z1);
      const ab0 = a0 + u * (a1 - a0), ab1 = b0 + u * (b1 - b0);
      const cd0 = c0 + u * (c1 - c0), cd1 = d0 + u * (d1 - d0);
      const lo = ab0 + v * (ab1 - ab0), hi = cd0 + v * (cd1 - cd0);
      return lo + w * (hi - lo);
    };
  }

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ---------- cube faces ----------
  // N = outward normal, U = right, V = down, as seen from outside. Cross-shaped net:
  //            [+Y]
  //   [-X]  [+Z]  [+X]  [-Z]
  //            [-Y]
  // (U, N, V) is right-handed on every face, so local x = U, y = N (up), z = V.
  const FACES = [
    { id: "+Z", N: [0, 0, 1], U: [1, 0, 0], V: [0, -1, 0], net: [1, 1] },
    { id: "+X", N: [1, 0, 0], U: [0, 0, -1], V: [0, -1, 0], net: [2, 1] },
    { id: "-Z", N: [0, 0, -1], U: [-1, 0, 0], V: [0, -1, 0], net: [3, 1] },
    { id: "-X", N: [-1, 0, 0], U: [0, 0, 1], V: [0, -1, 0], net: [0, 1] },
    { id: "+Y", N: [0, 1, 0], U: [1, 0, 0], V: [0, 0, 1], net: [1, 0] },
    { id: "-Y", N: [0, -1, 0], U: [1, 0, 0], V: [0, 0, -1], net: [1, 2] },
  ];

  // Biomes (numbers are what the generator returns; names and map colours for display).
  const BIOMES = [
    ["deep_ocean", "Deep ocean", [28, 58, 120]],
    ["ocean", "Ocean", [44, 92, 168]],
    ["frozen_ocean", "Frozen ocean", [120, 160, 205]],
    ["river", "River", [62, 128, 210]],
    ["beach", "Beach", [226, 211, 154]],
    ["plains", "Plains", [141, 193, 82]],
    ["meadow", "Flower meadow", [168, 205, 96]],
    ["forest", "Forest", [63, 138, 52]],
    ["birch_forest", "Birch forest", [104, 168, 79]],
    ["taiga", "Taiga", [70, 112, 82]],
    ["snowy_plains", "Snowy plains", [235, 241, 246]],
    ["snowy_taiga", "Snowy taiga", [196, 214, 206]],
    ["snowy_peaks", "Snowy peaks", [255, 255, 255]],
    ["stony_peaks", "Stony peaks", [150, 152, 156]],
    ["desert", "Desert", [232, 207, 138]],
    ["savanna", "Savanna", [190, 180, 92]],
    ["volcanic", "Volcanic", [74, 66, 66]],
  ];
  const B = {};
  BIOMES.forEach((b, i) => (B[b[0]] = i));

  function create(seed, opts) {
    opts = opts || {};
    const F = opts.faceSize || 2048;
    const R = F / 2;
    const SEA = 0;
    seed = seed | 0;
    // Continents and climate zones grow with the planet; terrain detail stays human-scale.
    const K = clamp(Math.sqrt(F / 2048), 1, 3);
    const SC = { warp: 400 * K, cont: 760 * K, eros: 420 * Math.sqrt(K), ridge: 240 * Math.sqrt(K), river: 520 * Math.sqrt(K),
                 temp: 1150 * K, hum: 950 * K, volc: 320 * Math.sqrt(K), warpAmt: 60 * K };
    const P = (k) => Perlin((Math.imul(seed, 1013) + k * 7919) | 0);
    const nCont = P(1), nEros = P(2), nRidge = P(3), nTemp = P(4), nHum = P(5), nRiver = P(6),
      nDetail = P(7), nPatch = P(8), nCaveA = P(9), nCaveB = P(10), nCaveC = P(11), nVolc = P(12),
      nLava = P(13), nWarp = P(18);

    function fbm(n, x, y, z, oct) {
      let s = 0, a = 1, f = 1, t = 0;
      for (let i = 0; i < oct; i++) {
        s += a * n(x * f + i * 31.7, y * f + i * 17.3, z * f - i * 11.1);
        t += a; a *= 0.5; f *= 2;
      }
      return (s / t) * 1.9;
    }

    function hash(a, b, c, d) {
      let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c, 1274126177) + Math.imul(d, 2246822519) + Math.imul(seed, 3266489917)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    }

    // Height curve over continentalness (piecewise linear, unrolled for speed).
    const CX = [-1, -0.5, -0.22, -0.08, 0.0, 0.15, 0.5, 1], CY = [-46, -34, -12, -3, 1, 6, 15, 24];
    function contCurve(c) {
      if (c <= CX[0]) return CY[0];
      for (let i = 1; i < 8; i++) if (c <= CX[i]) return CY[i - 1] + (CY[i] - CY[i - 1]) * (c - CX[i - 1]) / (CX[i] - CX[i - 1]);
      return CY[7];
    }

    // One column at the 3D point (x, y, z) on the cube surface. Writes height and biome into out.
    function column(x, y, z, out) {
      const ws = SC.warp, wa = SC.warpAmt;
      const wx = x + fbm(nWarp, x / ws, y / ws, z / ws, 2) * wa;
      const wy = y + fbm(nWarp, y / ws + 9.1, z / ws, x / ws, 2) * wa;
      const wz = z + fbm(nWarp, z / ws - 4.7, x / ws, y / ws, 2) * wa;
      const cont = clamp(fbm(nCont, wx / SC.cont, wy / SC.cont, wz / SC.cont, 5) + 0.12, -1, 1);
      const eros = clamp(fbm(nEros, wx / SC.eros, wy / SC.eros, wz / SC.eros, 4), -1, 1);
      const e01 = (eros + 1) / 2;
      const ridge = 1 - Math.abs(fbm(nRidge, wx / SC.ridge, wy / SC.ridge, wz / SC.ridge, 4));

      let h = contCurve(cont);
      h += fbm(nDetail, x / 55, y / 55, z / 55, 4) * (3 + 11 * (1 - e01));
      const inland = sstep(0.04, 0.32, cont);
      const pk = ridge > 0.5 ? Math.pow((ridge - 0.5) / 0.5, 1.6) : 0;
      h += inland * pk * 95 * (0.2 + 0.8 * (1 - e01));

      const rv = Math.abs(fbm(nRiver, wx / SC.river, wy / SC.river, wz / SC.river, 3));
      const riverAmt = (1 - sstep(0.018, 0.05, rv)) * sstep(-0.06, 0.06, cont) * (1 - sstep(22, 42, h));
      let river = false;
      if (riverAmt > 0 && h > -3) { h = h + (-3 - h) * riverAmt; river = riverAmt > 0.55; }
      if (h > 150) h = 150;

      // climate: noise, plus cool "poles" at the centres of the top and bottom faces, and colder up high
      const ay = Math.abs(y) / Math.max(Math.abs(x), Math.abs(y), Math.abs(z));
      const temp0 = clamp(0.58 + fbm(nTemp, x / SC.temp, y / SC.temp, z / SC.temp, 3) * 0.72 - 0.2 * sstep(0.55, 1, ay), 0, 1);
      const hum = clamp(0.5 + fbm(nHum, x / SC.hum, y / SC.hum, z / SC.hum, 3) * 0.75, 0, 1);
      const temp = temp0 - Math.max(0, h - 28) / 140;

      let b;
      if (river && h <= -1) b = temp < 0.2 ? B.frozen_ocean : B.river;
      else if (h < -16) b = temp < 0.2 ? B.frozen_ocean : B.deep_ocean;
      else if (h < -1) b = temp < 0.2 ? B.frozen_ocean : B.ocean;
      else if (h < 2 && cont < 0.08) b = temp < 0.22 ? B.snowy_plains : B.beach;
      else if (h > 62) b = temp < 0.36 ? B.snowy_peaks : B.stony_peaks;
      else if (temp < 0.25) b = hum > 0.5 ? B.snowy_taiga : B.snowy_plains;
      else if (temp > 0.68) {
        if (inland > 0.4 && fbm(nVolc, x / SC.volc, y / SC.volc, z / SC.volc, 3) > 0.38) b = B.volcanic;
        else b = hum < 0.45 ? B.desert : B.savanna;
      } else if (hum > 0.62) b = temp < 0.4 ? B.taiga : B.forest;
      else if (hum > 0.52) b = temp < 0.4 ? B.taiga : B.birch_forest;
      else b = fbm(nPatch, x / 160, y / 160, z / 160, 2) > 0.45 ? B.meadow : B.plains;
      out.h = h; out.b = b; out.t = temp;
      return out;
    }

    // Face-local block coordinates -> 3D. (u, v) may run past the face edge (used near edges).
    // Returns the projection of the column's base point onto the cube surface.
    const tmp = [0, 0, 0];
    function basePoint(f, u, v, outp) {
      const fc = FACES[f], s = u - R + 0.5, t = v - R + 0.5;
      const x = fc.N[0] * R + fc.U[0] * s + fc.V[0] * t;
      const y = fc.N[1] * R + fc.U[1] * s + fc.V[1] * t;
      const z = fc.N[2] * R + fc.U[2] * s + fc.V[2] * t;
      const m = Math.max(R, Math.abs(s), Math.abs(t));
      const k = R / m;
      outp[0] = x * k; outp[1] = y * k; outp[2] = z * k;
      return outp;
    }
    const colTmp = { h: 0, b: 0, t: 0 };
    function columnAt(f, u, v) {
      basePoint(f, u, v, tmp);
      return column(tmp[0], tmp[1], tmp[2], { h: 0, b: 0, t: 0 });
    }

    // Which face owns the 3D point (the axis it is furthest along), and its block coordinates there.
    // Blocks stand straight up from their face, so u, v are a straight projection onto the face plane
    // (they run past 0..F-1 for high ground near an edge, which the edge chunks hold).
    function locate(x, y, z) {
      const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
      let f;
      if (ax >= ay && ax >= az) f = x > 0 ? 1 : 3;
      else if (ay >= az) f = y > 0 ? 4 : 5;
      else f = z > 0 ? 0 : 2;
      const fc = FACES[f];
      return { f,
        u: x * fc.U[0] + y * fc.U[1] + z * fc.U[2] + R - 0.5,
        v: x * fc.V[0] + y * fc.V[1] + z * fc.V[2] + R - 0.5,
        alt: x * fc.N[0] + y * fc.N[1] + z * fc.N[2] - R };
    }

    // The ground column reached by walking from face f block (u, v), where u, v may run past the face:
    // the walk bends over the edge onto the next face (the cube surface is unfolded).
    function walkTo(f, u, v) {
      basePoint(f, u, v, tmp);
      return locate(tmp[0], tmp[1], tmp[2]);
    }

    // ---------- chunks ----------
    const CS = opts.chunkSize || 32;
    const SLATE_LINE = -44;
    const MIN_Y = -60;
    const ORES = [

    ["ocean", "Ocean", [44, 92, 168]],
    ["frozen_ocean", "Frozen ocean", [120, 160, 205]],
    ["river", "River", [62, 128, 210]],
    ["beach", "Beach", [226, 211, 154]],
    ["plains", "Plains", [141, 193, 82]],
    ["meadow", "Flower meadow", [168, 205, 96]],
    ["forest", "Forest", [63, 138, 52]],
    ["birch_forest", "Birch forest", [104, 168, 79]],
    ["taiga", "Taiga", [70, 112, 82]],
    ["snowy_plains", "Snowy plains", [235, 241, 246]],
    ["snowy_taiga", "Snowy taiga", [196, 214, 206]],

  function create(seed, opts) {

    const CX = [-1, -0.5, -0.22, -0.08, 0.0, 0.15, 0.5, 1], CY = [-46, -34, -12, -3, 1, 6, 15, 24];

    // One column at the 3D point (x, y, z) on the cube surface. Writes height and biome into out.

      let h = contCurve(cont);

      const inland = sstep(0.04, 0.32, cont);
      const pk = ridge > 0.5 ? Math.pow((ridge - 0.5) / 0.5, 1.6) : 0;

      const rv = Math.abs(fbm(nRiver, wx / SC.river, wy / SC.river, wz / SC.river, 3));
      const riverAmt = (1 - sstep(0.018, 0.05, rv)) * sstep(-0.06, 0.06, cont) * (1 - sstep(22, 42, h));

      const ay = Math.abs(y) / Math.max(Math.abs(x), Math.abs(y), Math.abs(z));
      const temp0 = clamp(0.58 + fbm(nTemp, x / SC.temp, y / SC.temp, z / SC.temp, 3) * 0.72 - 0.2 * sstep(0.55, 1, ay), 0, 1);
      const hum = clamp(0.5 + fbm(nHum, x / SC.hum, y / SC.hum, z / SC.hum, 3) * 0.75, 0, 1);
      const temp = temp0 - Math.max(0, h - 28) / 140;

      let b;
      if (river && h <= -1) b = temp < 0.2 ? B.frozen_ocean : B.river;
      else if (h < -16) b = temp < 0.2 ? B.frozen_ocean : B.deep_ocean;
      else if (h < -1) b = temp < 0.2 ? B.frozen_ocean : B.ocean;
      else if (h < 2 && cont < 0.08) b = temp < 0.22 ? B.snowy_plains : B.beach;
      else if (h > 62) b = temp < 0.36 ? B.snowy_peaks : B.stony_peaks;
      else if (temp < 0.25) b = hum > 0.5 ? B.snowy_taiga : B.snowy_plains;
      else if (temp > 0.68) {

    const CS = opts.chunkSize || 32;

      { name: "iron", per: 5, min: 3, max: 9, lo: -320, hi: 34 },
      { name: "gold", per: 2, min: 3, max: 8, lo: -420, hi: -14 },

      for (let i = 0; i < LX; i++) for (let j = 0; j < LZ; j++) {

        const b00 = (li * LZ + lj) * LY + ly, b10 = ((li + 1) * LZ + lj) * LY + ly;

      const iSand = ID.sand, iSandstone = ID.sandstone, iStone = ID.stone, iSlate = ID.slate, iDirt = ID.dirt,
        iGrass = ID.grass, iSnowGrass = ID.snow_grass, iSnow = ID.snow, iAsh = ID.ash, iGravel = ID.gravel,
        iClay = ID.clay, iWater = ID.water, iLava = ID.lava;

      for (let i = 0; i < SX; i++) for (let j = 0; j < SZ; j++) {

          case B.snowy_plains: case B.snowy_taiga: top = iSnowGrass; sub = iDirt; break;
          case B.snowy_peaks: top = iSnow; sub = iSnow; subN = 2; break;
          case B.stony_peaks: top = iStone; sub = iStone; break;
          case B.volcanic: top = iAsh; sub = iAsh; break;
          default: top = iGrass; sub = iDirt;

        if (wet) {
          const r = hash(u, v, f, 1);
          if (bio === B.river) top = r < 0.6 ? iGravel : iSand;
          else if (bio === B.deep_ocean) top = r < 0.5 ? iGravel : iClay;
          else top = r < 0.62 ? iSand : r < 0.85 ? iGravel : iClay;

        }

        if (bio === B.volcanic) { basePoint(f, u, v, tmp); lavaCrack = Math.abs(fbm(nLava, tmp[0] / 30, tmp[1] / 30, tmp[2] / 30, 2)) < 0.07; }
        const liquid = bio === B.volcanic ? iLava : (bio === B.frozen_ocean ? iWater : iWater);
        const colBase = (i * SZ + j) * Y;

          const y = a - ylo;
          if (a > Hc) { W[colBase + y] = (bio === B.frozen_ocean && a === SEA) ? iSnow : liquid; continue; }
          const d = Hc - a;
          let b;
          if (d === 0) b = lavaCrack ? iLava : top;

          else if (l2 && d < subN + l2N) b = l2;
          else b = iStone;
          if (b === iStone && (a < SLATE_LINE || (a < SLATE_LINE + 5 && hash(u * 3 + a, v, f, 7) < (SLATE_LINE + 5 - a) / 6))) b = iSlate;
          if (d > 4 && !(wet && d < 10) && a > ylo + 1) {
            const cheese = lerp3(LA, i, j, y);
            const boost = d > 40 ? 0.08 : d * 0.002;
            if (cheese > 0.62 - boost) { W[colBase + y] = (a < SLATE_LINE - 8 && cheese > 0.7) ? iLava : 0; continue; }
            const t1 = lerp3(LB, i, j, y);
            if (t1 > -0.055 && t1 < 0.055) {
              const t2 = lerp3(LC, i, j, y);
              if (t2 > -0.055 && t2 < 0.055) { W[colBase + y] = 0; continue; }
            }
          }
          W[colBase + y] = b;
        }
      }

      // --- ore veins: a scatter of short random walks per 16-block cell ---
      const oreIds = ORES.map((o) => [ID[o.name], ID["slate_" + o.name]]);
      const cA0 = Math.floor((ylo) / 16), cA1 = Math.floor((yhi) / 16);
      const cU0 = Math.floor((x0 - 10) / 16), cU1 = Math.floor((x0 + SX + 10) / 16);
      const cV0 = Math.floor((z0 - 10) / 16), cV1 = Math.floor((z0 + SZ + 10) / 16);
      for (let cu2 = cU0; cu2 <= cU1; cu2++) for (let cv2 = cV0; cv2 <= cV1; cv2++) for (let ca = cA0; ca <= cA1; ca++) {
        const rnd = mulberry32((Math.imul(cu2, 73856093) ^ Math.imul(cv2, 19349663) ^ Math.imul(ca, 83492791) ^ Math.imul(f + 1, 2654435761) ^ seed) | 0);
        for (let o = 0; o < ORES.length; o++) {
          const ore = ORES[o];
          const aMid = ca * 16 + 8;
          if (aMid < ore.lo || aMid > ore.hi) { rnd(); continue; }
          let n = Math.floor(ore.per * (0.5 + rnd()));
          while (n-- > 0) {
            let pu = cu2 * 16 + Math.floor(rnd() * 16), pv = cv2 * 16 + Math.floor(rnd() * 16), pa = ca * 16 + Math.floor(rnd() * 16);
            const len = ore.min + Math.floor(rnd() * (ore.max - ore.min));
            for (let st = 0; st < len; st++) {
              const i = pu - x0, j = pv - z0, y = pa - ylo;
              if (i >= 0 && j >= 0 && y >= 0 && i < SX && j < SZ && y < Y) {
                const k = (i * SZ + j) * Y + y, cur = W[k];
                if (cur === iStone) W[k] = oreIds[o][0];
                else if (cur === iSlate) W[k] = oreIds[o][1];

      // --- trees and plants (from the margin columns too, so canopies cross chunk borders) ---

        const k = (i * SZ + j) * Y + y;

  // keyboard and touch pad
  const keys = new Set();
  window.addEventListener("keydown", (e) => { if (e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") keys.add(e.key.toLowerCase()); });
  window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
  const padDirs = new Set();
  for (const b of document.querySelectorAll(".pad [data-dir]")) {
    const d = b.dataset.dir;
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); padDirs.add(d); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => padDirs.delete(d));
  }
  let fast = false;
  document.getElementById("fast").addEventListener("click", (e) => { fast = !fast; e.currentTarget.setAttribute("aria-pressed", String(fast)); });

  function move(dt) {
    let fx = 0, fz = 0;
    if (keys.has("w") || keys.has("arrowup") || padDirs.has("up")) fz -= 1;
    if (keys.has("s") || keys.has("arrowdown") || padDirs.has("down")) fz += 1;
    if (keys.has("a") || keys.has("arrowleft") || padDirs.has("left")) fx -= 1;
    if (keys.has("d") || keys.has("arrowright") || padDirs.has("right")) fx += 1;
    if (!fx && !fz) return;
    const fwd = new THREE.Vector3().subVectors(controls.target, camera.position); fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const dist = camera.position.distanceTo(controls.target);
    const speed = Math.max(20, dist * 0.9) * (fast || keys.has("shift") ? 8 : 1) * dt;
    const step = fwd.multiplyScalar(-fz * speed).add(right.multiplyScalar(fx * speed));
    controls.target.add(step); camera.position.add(step);
  }

  // follow the ground height under the focus
  let lastGround = 0;
  function followGround(now) {
    if (now - lastGround < 120) return;
    lastGround = now;
    const t = controls.target;
    const L = columnUnder(t.x, t.z);
    const c = gen.columnAt(L.f, clampF(L.u), clampF(L.v));
    const want = Math.max(c.h, 0) + 2;
    const dy = (want - t.y) * 0.35;
    t.y += dy; camera.position.y += dy;
    where(L, c);
  }

  function where(L, c) {
    const bi = PlanetGen.BIOMES[c.b];
    document.getElementById("where").innerHTML =
      `<b>${bi[1]}</b> on face <b>${FACES[L.f].id}</b><br>Block ${Math.round(clampF(L.u)).toLocaleString()}, ${Math.round(clampF(L.v)).toLocaleString()} of ${F.toLocaleString()} · height ${Math.round(c.h)}`;
  }

  // ---------- UI ----------
  let xray = false;
  document.getElementById("xray").addEventListener("click", (e) => {
    xray = !xray; e.currentTarget.setAttribute("aria-pressed", String(xray));
    for (const ent of chunks.values()) for (const m of ent.meshes) m.visible = m.userData.surface || xray;
  });
  document.getElementById("dist").addEventListener("change", () => { refreshDesired(true); if (scene.fog) { scene.fog.near = fogNear(); } });
  document.getElementById("m-globe").addEventListener("click", () => setMode("globe"));
  function setShape(s) {
    globeShape = s;
    document.getElementById("s-cube").setAttribute("aria-pressed", String(s === "cube"));
    document.getElementById("s-sphere").setAttribute("aria-pressed", String(s === "sphere"));
    if (lastGlobe) onGlobe(lastGlobe);
    if (mode !== "globe") setMode("globe");
  }
  document.getElementById("s-cube").addEventListener("click", () => setShape("cube"));
  document.getElementById("s-sphere").addEventListener("click", () => setShape("sphere"));
  document.getElementById("m-ground").addEventListener("click", () => setMode("ground"));
  document.getElementById("m-core").addEventListener("click", () => setMode("core"));
  document.getElementById("land").addEventListener("click", () => { const s = niceSpot(Math.random); landAt(s.f, s.u, s.v); });
  const fold = document.getElementById("fold"), body = document.getElementById("body");
  fold.addEventListener("click", () => { body.hidden = !body.hidden; fold.textContent = body.hidden ? "Show" : "Hide"; fold.setAttribute("aria-expanded", String(!body.hidden)); });
  document.getElementById("go").addEventListener("click", () => newPlanet());
  document.getElementById("seed").addEventListener("keydown", (e) => { if (e.key === "Enter") newPlanet(); });
  document.getElementById("rand").addEventListener("click", () => { document.getElementById("seed").value = Math.floor(Math.random() * 1e6); newPlanet(); });
  document.getElementById("size").addEventListener("change", () => newPlanet());
  function hint() {
    document.getElementById("hint").textContent = mode === "core"
      ? "Drag to turn the cut-out · tap a layer on the slice, or use the slider, to go deeper"
      : mode === "globe"
      ? "Drag to spin the planet · tap anywhere to land there"
      : (touch ? "Drag to look · pinch to zoom · arrows to travel (×8 for fast)" : "Drag to look · scroll to zoom · WASD or arrows to travel, hold Shift for fast");
  }

  // a good first landing spot: land with a mix of biomes, chosen deterministically from the seed
  function niceSpot(rnd) {
    let best = null;
    for (let k = 0; k < 160; k++) {
      const f = Math.floor(rnd() * 6), u = 256 + rnd() * (F - 512), v = 256 + rnd() * (F - 512);
      const set = new Set(); let land = 0, high = 0;
      for (let a = -96; a <= 96; a += 48) for (let b = -96; b <= 96; b += 48) {
        const c = gen.columnAt(f, u + a, v + b); set.add(c.b); if (c.h > 1) land++; if (c.h > 30) high++;
      }
      const s = Math.min(set.size, 5) + land / 6 + Math.min(high, 4) * 0.4;
      if (!best || s > best.s) best = { s, f, u, v };
    }
    return best;
  }
  function seeded(s) { let a = s | 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function newPlanet() {
    sliceKey = ""; sliceImg = null;
    SEED = parseInt(document.getElementById("seed").value, 10) || 0;
    F = parseInt(document.getElementById("size").value, 10); R = F / 2;
    genId++;
    gen = PlanetGen.create(SEED, { faceSize: F, chunkSize: CS });
    const info = META.blocks;
    for (const w of workers) { w.busy = 0; w.postMessage({ type: "init", seed: SEED, F, info, atlas: META.atlas, ID }); }
    for (const e of chunks.values()) dropChunk(e);
    chunks.clear(); queue = [];
    if (globeMesh) { globeGroup.remove(globeMesh); globeMesh.geometry.dispose(); globeMesh = null; }
    stat = { gen: 0, mesh: 0, n: 0, tris: 0 };
    const s = niceSpot(seeded(SEED));
    landAt(s.f, s.u, s.v);
    if (mode === "globe") requestGlobe();
    if (mode === "core") setMode("core");
    if (scene.fog) scene.fog.far = fogFar();
  }

  // ---------- loop ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    gCam.aspect = w / h; gCam.updateProjectionMatrix();
    dCam.aspect = w / h; dCam.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  let last = performance.now(), lastRefresh = 0, frames = 0, fpsAt = last, fps = 0, farFrom = null;
  const statsEl = document.getElementById("stats"), busyEl = document.getElementById("busy");
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (mode === "ground") {
      move(dt);
      controls.update();
      rehomeIfNeeded();
      followGround(now);
      if (now - lastRefresh > 300) { lastRefresh = now; refreshDesired(false); }
      const t = controls.target, uvF = homeUV(t.x, t.z), pF = [0, 0, 0];
      gen.basePoint(home, uvF[0], uvF[1], pF);
      if (farAt && farAt.distanceTo(new THREE.Vector3(...pF)) > 900) requestFar();
      renderer.render(scene, camera);
    } else if (mode === "core") {
      dControls.update();
      renderer.render(scene, dCam);
    } else {
      gControls.update();
      renderer.render(scene, gCam);
    }
    frames++;
    if (now - fpsAt > 500) {
      fps = Math.round(frames * 1000 / (now - fpsAt)); frames = 0; fpsAt = now;
      let ready = 0, tris = 0;
      for (const e of chunks.values()) if (e.state === "ready") { ready++; for (const m of e.meshes) if (m.visible) tris += m.geometry.index.count / 3; }
      statsEl.innerHTML = `<b>${fps}</b> fps · chunks <b>${ready}</b>/${desired.size}<br>` +
        `${stat.n ? (stat.gen / stat.n).toFixed(0) : "–"} ms build + ${stat.n ? (stat.mesh / stat.n).toFixed(0) : "–"} ms mesh per chunk · ${NW} threads<br>` +
        `${(tris / 1000).toFixed(0)}k triangles drawn`;
      busyEl.hidden = ready > 0 || mode !== "ground";
    }
    requestAnimationFrame(loop);
  }

  window.cc = {
    ready: () => { let r = 0; for (const e of chunks.values()) if (e.state === "ready") r++; return r >= desired.size && desired.size > 0 && !!farMesh; },
    globeReady: () => !!globeMesh,
    mode: setMode,
    shape: (s) => document.getElementById(s === "sphere" ? "s-sphere" : "s-cube").click(),
    goto: (f, u, v) => landAt(f, u, v),
    look: (pos, target) => { camera.position.set(...pos); controls.target.set(...target); controls.update(); },
    gcam: (pos) => { gCam.position.set(...pos); gControls.update(); },
    core: (d) => { depthEl.value = d; if (mode !== "core") setMode("core"); else requestDeep(); },
    coreReady: () => deepMeshes.length > 0 && !!sliceImg,
    xray: () => document.getElementById("xray").click(),
    walk: (dx, dz) => { controls.target.x += dx; controls.target.z += dz; camera.position.x += dx; camera.position.z += dz; controls.update(); rehomeIfNeeded(); lastGround = 0; followGround(performance.now()); },
    lookRel: (off) => { const t = controls.target; camera.position.set(t.x + off[0], t.y + off[1], t.z + off[2]); controls.update(); },
    state: () => { const t = controls.target, L = columnUnder(t.x, t.z); return { home, desired: desired.size, face: FACES[L.f].id, u: Math.round(L.u), v: Math.round(L.v) }; },
  };

  hint();
  newPlanet();
  requestAnimationFrame(loop);
})();
</script>
