<title>Cube Craft Planet Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen world; a foldable control card top-left; a live stats strip top-right; travel pad bottom-right on touch screens. Single dark UI over a daytime sky. */
:root {
  --sky-top: #5d9fdc;
  --sky-low: #d2ecfa;
  --space: #07101e;
  --panel: rgba(16, 20, 26, 0.86);
  --panel-line: rgba(255, 255, 255, 0.12);
  --ink: #eef2f6;
  --muted: #a9b4c0;
  --grass: #7cc24f;
  --grass-ink: #10200a;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-ui: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-low)); color: var(--ink); font-family: var(--font-ui); }
body.globe { background: radial-gradient(circle at 50% 45%, #12305a 0%, var(--space) 70%); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.card {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px;
  width: min(370px, calc(100% - 24px)); box-sizing: border-box; max-height: calc(100% - 90px); overflow-y: auto;
  padding: 14px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
  display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(6px);
}
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; }
.name span { color: var(--grass); }
.body { display: flex; flex-direction: column; gap: 12px; }
.body[hidden], .busy[hidden], .pad[hidden] { display: none; }
.sub { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--panel-line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--panel-line); }
label { font-size: 13px; color: var(--muted); }
input[type="number"], select {
  min-height: 36px; box-sizing: border-box; padding: 0 10px; font: 500 15px var(--font-ui); color: var(--ink);
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--panel-line); border-radius: 6px; font-variant-numeric: tabular-nums;
}
input[type="number"] { width: 110px; }
select option { background: #1b2028; }
button {
  font: 500 14px/1 var(--font-ui); color: var(--ink); background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--panel-line); border-radius: 6px; min-height: 36px; padding: 0 12px; cursor: pointer;
}
button:hover { background: rgba(255, 255, 255, 0.16); }
button[aria-pressed="true"], button.primary { background: var(--grass); color: var(--grass-ink); border-color: var(--grass); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--grass); outline-offset: 2px; }
.where { margin: 0; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.where b { font-weight: 600; }
.stats {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; margin: 0;
  padding: 8px 10px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 8px;
  font-size: 12px; line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; pointer-events: none;
}
.stats b { color: var(--ink); font-weight: 600; }
.hint { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0; text-align: center; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); pointer-events: none; }
.busy { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 22px; color: #eef2f6; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); pointer-events: none; }
.pad { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; }
.pad button { width: 52px; height: 52px; padding: 0; font-size: 20px; background: var(--panel); }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 3; } .pad .fast { grid-column: 2; grid-row: 2; font-size: 12px; }
@media (max-width: 560px) { .stats { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 220px); } }
</style>

<canvas id="scene" aria-label="3D view of the Cube Craft planet"></canvas>
<p class="busy" id="busy">Building the planet…</p>
<section class="card" aria-label="Planet explorer">
  <div class="head">
    <h1 class="name">Cube<span>Craft</span></h1>
    <div class="row">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="m-globe" aria-pressed="false">Globe</button>
        <button type="button" id="m-ground" aria-pressed="true">Ground</button>
      </div>
      <button type="button" id="fold" aria-expanded="true">Hide</button>
    </div>
  </div>
  <div class="body" id="body">
    <p class="where" id="where">Finding a place to land…</p>
    <div class="row">
      <label for="size">Size</label>
      <select id="size">
        <option value="2048">2,048 per face</option>
        <option value="4096">4,096 per face</option>
        <option value="8192">8,192 per face</option>
        <option value="16384" selected>16,384 per face</option>
      </select>
    </div>
    <div class="row">
      <label for="seed">Seed</label>
      <input type="number" id="seed" value="1234" inputmode="numeric">
      <button type="button" class="primary" id="go">Generate</button>
      <button type="button" id="rand">Random</button>
    </div>
    <div class="row">
      <label for="dist">View</label>
      <select id="dist">
        <option value="3">Near (phones)</option>
        <option value="5">Medium</option>
        <option value="7">Far</option>
      </select>
      <button type="button" id="xray" aria-pressed="false">Underground</button>
      <button type="button" id="land">New spot</button>
    </div>
    <p class="sub">Globe: drag to spin, tap to land. Ground: drag to look, pinch or scroll to zoom, two fingers or right-drag to move, or use WASD / the arrows. Walk off an edge and you carry on onto the next face.</p>
  </div>
</section>
<p class="stats" id="stats"></p>
<div class="pad" id="pad" hidden>
  <button type="button" class="up" data-dir="up" aria-label="Move forward">↑</button>
  <button type="button" class="left" data-dir="left" aria-label="Move left">←</button>
  <button type="button" class="fast" id="fast" aria-pressed="false" aria-label="Fast travel">×8</button>
  <button type="button" class="right" data-dir="right" aria-label="Move right">→</button>
  <button type="button" class="down" data-dir="down" aria-label="Move back">↓</button>
</div>
<p class="hint" id="hint"></p>

<script id="worker-src" type="text/plain">
__PLANETGEN__
__MESHER__
__WORKER__
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
__PLANETGEN__
</script>
<script>
(function () {
  "use strict";
  const META = __META__;
  const ATLAS = "data:image/png;base64,__ATLAS__";
  const ID = {}; META.names.forEach((n, i) => (ID[n] = i));
  const CS = 32;
  const touch = window.matchMedia("(pointer: coarse)").matches;
  if (touch) document.getElementById("pad").hidden = false;
  document.getElementById("dist").value = touch ? "3" : "5";

  // ---------- workers ----------
  const src = document.getElementById("worker-src").textContent;
  const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
  const NW = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1));
  const workers = [];
  for (let i = 0; i < NW; i++) { const w = new Worker(url); w.busy = 0; w.onmessage = onWorker; workers.push(w); }

  // ---------- three.js ----------
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !touch, alpha: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, touch ? 1.5 : 2));
  const scene = new THREE.Scene();
  const fogColor = new THREE.Color(0xd2ecfa);
  scene.fog = new THREE.Fog(fogColor, 400, 3000);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.2, 9000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.09; controls.screenSpacePanning = false;
  controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 4; controls.maxDistance = 900;

  const tex = new THREE.TextureLoader().load(ATLAS);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const MATS = {
    opaque: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, alphaTest: 0.5 }),
    plant: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, alphaTest: 0.5, side: THREE.DoubleSide }),
    lava: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true }),
    trans: new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, opacity: 0.82, depthWrite: false }),
  };
  const farMat = new THREE.MeshBasicMaterial({ vertexColors: true });

  const root = new THREE.Group(); root.matrixAutoUpdate = false; scene.add(root);
  const globeGroup = new THREE.Group(); globeGroup.visible = false; scene.add(globeGroup);

  // ---------- planet state ----------
  let F = 16384, R = F / 2, SEED = 1234, gen = null, genId = 0;
  const FACES = PlanetGen.FACES;
  const faceMat = FACES.map((fc) => new THREE.Matrix4().makeBasis(new THREE.Vector3(...fc.U), new THREE.Vector3(...fc.N), new THREE.Vector3(...fc.V)));
  // view frame: a rotation whose up (+Y) is the home face's normal; origin = point on the home base plane
  let home = 4, origin = new THREE.Vector3();
  const frame = new THREE.Matrix4();
  const Rinv = new THREE.Matrix4();
  function updateRoot() {
    Rinv.copy(frame).transpose();
    root.matrix.copy(Rinv).multiply(new THREE.Matrix4().makeTranslation(-origin.x, -origin.y, -origin.z));
    root.matrixWorldNeedsUpdate = true;
  }
  const viewToWorld = (v) => v.clone().applyMatrix4(frame).add(origin);
  // home-face block coordinates of a view position, and the ground column there (bending over edges)
  const _w = new THREE.Vector3();
  function homeUV(x, z) {
    const fc = FACES[home], e = frame.elements;   // columns: right (0..2), up (4..6), back (8..10)
    _w.set(origin.x + e[0] * x + e[8] * z, origin.y + e[1] * x + e[9] * z, origin.z + e[2] * x + e[10] * z);
    return [_w.x * fc.U[0] + _w.y * fc.U[1] + _w.z * fc.U[2] + R - 0.5, _w.x * fc.V[0] + _w.y * fc.V[1] + _w.z * fc.V[2] + R - 0.5];
  }
  function columnUnder(x, z) { const uv = homeUV(x, z); return gen.walkTo(home, uv[0], uv[1]); }
  const clampF = (a) => Math.max(0, Math.min(F - 1, a));
  const worldToView = (w) => w.clone().sub(origin).applyMatrix4(Rinv);

  // ---------- chunks ----------
  const chunks = new Map();        // key -> entry
  let desired = new Map();         // key -> distance
  let queue = [];
  let stat = { gen: 0, mesh: 0, n: 0, tris: 0 };
  const keyOf = (f, cu, cv) => f + ":" + cu + ":" + cv;

  function wallsFor(f, cu, cv) {
    const n = F / CS;
    return {
      nx: cu > 0 && !desired.has(keyOf(f, cu - 1, cv)),
      px: cu < n - 1 && !desired.has(keyOf(f, cu + 1, cv)),
      nz: cv > 0 && !desired.has(keyOf(f, cu, cv - 1)),
      pz: cv < n - 1 && !desired.has(keyOf(f, cu, cv + 1)),
    };
  }
  const sameWalls = (a, b) => a && b && a.nx === b.nx && a.px === b.px && a.nz === b.nz && a.pz === b.pz;

  function refreshDesired(force) {
    const t = controls.target;
    const radius = parseInt(document.getElementById("dist").value, 10) * CS + 16;
    const want = new Map();
    const n = F / CS;
    for (let dx = -radius; dx <= radius; dx += 12) for (let dz = -radius; dz <= radius; dz += 12) {
      const d = Math.hypot(dx, dz);
      if (d > radius) continue;
      const L = columnUnder(t.x + dx, t.z + dz);
      const cu = Math.max(0, Math.min(n - 1, Math.floor(L.u / CS))), cv = Math.max(0, Math.min(n - 1, Math.floor(L.v / CS)));
      const k = keyOf(L.f, cu, cv);
      if (!want.has(k) || want.get(k) > d) want.set(k, d);
    }
    desired = want;
    // unload what is no longer wanted
    for (const [k, e] of chunks) if (!want.has(k)) { dropChunk(e); chunks.delete(k); }
    // queue new chunks nearest first, and fix walls on loaded ones whose neighbours changed
    const todo = [];
    for (const [k, d] of want) {
      const [f, cu, cv] = k.split(":").map(Number);
      let e = chunks.get(k);
      if (!e) { e = { key: k, f, cu, cv, state: "queued", meshes: [], walls: null, worker: null }; chunks.set(k, e); todo.push([d, e]); }
      else if (e.state === "ready" && !sameWalls(e.walls, wallsFor(f, cu, cv))) { e.state = "requeue"; todo.push([d + 1000, e]); }
      else if (e.state === "queued" || e.state === "requeue") todo.push([e.state === "requeue" ? d + 1000 : d, e]);
    }
    todo.sort((a, b) => a[0] - b[0]);
    queue = todo.map((x) => x[1]);
    pump();
  }

  function pump() {
    for (const w of workers) {
      while (w.busy < 2 && queue.length) {
        const e = queue.shift();
        if (!chunks.has(e.key) || (e.state !== "queued" && e.state !== "requeue")) continue;
        const walls = wallsFor(e.f, e.cu, e.cv);
        const target = e.state === "requeue" && e.worker ? e.worker : w;
        if (target.busy >= 3) { queue.push(e); break; }
        const type = e.state === "requeue" ? "remesh" : "chunk";
        e.state = "loading"; e.worker = target; target.busy++;
        target.postMessage({ type, key: e.key, f: e.f, cu: e.cu, cv: e.cv, walls, gen: genId });
      }
    }
  }

  function dropChunk(e) {
    for (const m of e.meshes) { root.remove(m); m.geometry.dispose(); }
    e.meshes = [];
  }

  function onWorker(ev) {
    const msg = ev.data;
    this.busy = Math.max(0, this.busy - 1);
    if (msg.type === "chunk") {
      if (msg.gen !== genId) { pump(); return; }
      const e = chunks.get(msg.key);
      if (!e) { pump(); return; }
      dropChunk(e);
      const M = faceMat[msg.f].clone().multiply(new THREE.Matrix4().makeTranslation(msg.x0 - R, msg.ylo + R, msg.z0 - R));
      for (const band of msg.bands) {
        for (const g in band.groups) {
          const d = band.groups[g];
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(d.pos, 3));
          geo.setAttribute("uv", new THREE.BufferAttribute(d.uv, 2));
          geo.setAttribute("color", new THREE.BufferAttribute(d.col, 3));
          geo.setIndex(new THREE.BufferAttribute(d.idx, 1));
          geo.computeBoundingSphere();
          const m = new THREE.Mesh(geo, MATS[g]);
          m.matrixAutoUpdate = false; m.matrix.copy(M); m.matrixWorldNeedsUpdate = true;
          m.userData.surface = band.surface;
          m.visible = band.surface || xray;
          if (g === "trans") m.renderOrder = 2;
          root.add(m); e.meshes.push(m);
        }
      }
      e.walls = msg.walls; e.state = "ready"; e.tris = msg.tris;
      if (msg.genMs > 0) { stat.gen += msg.genMs; stat.mesh += msg.meshMs; stat.n++; }
    } else if (msg.type === "far") onFar(msg);
    else if (msg.type === "globe") onGlobe(msg);
    pump();
  }

  // ---------- distant land ----------
  let farMesh = null, farAt = null, farReq = 0;
  function requestFar() {
    const t = controls.target;
    const uv = homeUV(t.x, t.z);
    const p = [0, 0, 0]; gen.basePoint(home, uv[0], uv[1], p);
    farAt = new THREE.Vector3(...p);
    const big = F >= 8192;
    workers[0].postMessage({ type: "far", id: ++farReq, face: home, u0: uv[0], v0: uv[1],
      radius: big ? 4096 : Math.min(3072, F), step: big ? 32 : 24 });
    workers[0].busy++;
  }
  function onFar(msg) {
    if (msg.id !== farReq) return;
    if (farMesh) { root.remove(farMesh); farMesh.geometry.dispose(); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(msg.pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(msg.col, 3));
    geo.setIndex(new THREE.BufferAttribute(msg.idx, 1));
    geo.computeBoundingSphere();
    farMesh = new THREE.Mesh(geo, farMat);
    farMesh.matrixAutoUpdate = false;
    farMesh.matrix.makeTranslation(msg.base[0], msg.base[1], msg.base[2]);
    farMesh.renderOrder = -1; farMesh.matrixWorldNeedsUpdate = true;
    root.add(farMesh);
  }

  // ---------- globe ----------
  let globeMesh = null, globeReq = 0;
  const gCam = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
  const gControls = new THREE.OrbitControls(gCam, canvas);
  gControls.enableDamping = true; gControls.enablePan = false; gControls.minDistance = 1.8; gControls.maxDistance = 8; gControls.enabled = false;
  gCam.position.set(2.6, 2.1, 3.0);
  function requestGlobe() {
    workers[workers.length - 1].postMessage({ type: "globe", id: ++globeReq, res: touch ? 96 : 128 });
    workers[workers.length - 1].busy++;
  }
  function onGlobe(msg) {
    if (msg.id !== globeReq) return;
    if (globeMesh) { globeGroup.remove(globeMesh); globeMesh.geometry.dispose(); }
    const res = msg.res, n = res + 1, pos = [], col = [], idx = [];
    const p = [0, 0, 0];
    for (let f = 0; f < 6; f++) {
      const fc = FACES[f], d = msg.faces[f], base = pos.length / 3;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        gen.basePoint(f, i * F / res - 0.5, j * F / res - 0.5, p);
        // lift outward from the centre, so the shared edge points of two faces land in the same place
        const k = i * n + j, len = Math.hypot(p[0], p[1], p[2]), lift = 1 + Math.max(d.h[k], 0) / 150 * 0.05;
        pos.push(p[0] / R * lift, p[1] / R * lift, p[2] / R * lift);
        col.push(d.c[k * 3] / 255, d.c[k * 3 + 1] / 255, d.c[k * 3 + 2] / 255);
      }
      for (let i = 0; i < res; i++) for (let j = 0; j < res; j++) {
        const a = base + i * n + j, b = base + (i + 1) * n + j, c = base + (i + 1) * n + j + 1, dd = base + i * n + j + 1;
        idx.push(a, dd, c, a, c, b);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    globeMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
    globeGroup.add(globeMesh);
    if (!globeGroup.userData.lit) {
      globeGroup.add(new THREE.AmbientLight(0xffffff, 0.62));
      const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(3, 4, 2); globeGroup.add(sun);
      globeGroup.userData.lit = true;
    }
    markerUpdate();
  }
  const marker = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff4d3d }));
  globeGroup.add(marker);
  function markerUpdate() {
    const t = controls.target, L = columnUnder(t.x, t.z), p = [0, 0, 0];
    gen.basePoint(L.f, clampF(L.u), clampF(L.v), p);
    marker.position.set(p[0], p[1], p[2]).multiplyScalar(1.06 / R);
  }

  // ---------- modes ----------
  let mode = "ground";
  function setMode(m) {
    mode = m;
    document.getElementById("m-globe").setAttribute("aria-pressed", String(m === "globe"));
    document.getElementById("m-ground").setAttribute("aria-pressed", String(m === "ground"));
    document.body.classList.toggle("globe", m === "globe");
    root.visible = m === "ground"; globeGroup.visible = m === "globe";
    controls.enabled = m === "ground"; gControls.enabled = m === "globe";
    scene.fog = m === "ground" ? new THREE.Fog(fogColor, fogNear(), fogFar()) : null;
    document.getElementById("pad").hidden = !(touch && m === "ground");
    if (m === "globe") { markerUpdate(); if (!globeMesh) requestGlobe(); }
    hint();
  }
  const fogNear = () => parseInt(document.getElementById("dist").value, 10) * CS * 1.6;
  const fogFar = () => (F >= 8192 ? 3600 : 2600);

  // tap the globe to land there
  const ray = new THREE.Raycaster();
  let downAt = null;
  canvas.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
  canvas.addEventListener("pointerup", (e) => {
    if (mode !== "globe" || !downAt || !globeMesh) return;
    if (Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
    const r = canvas.getBoundingClientRect();
    ray.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, gCam);
    const hit = ray.intersectObject(globeMesh)[0];
    if (!hit) return;
    const p = hit.point.clone().multiplyScalar(R);
    const L = gen.locate(p.x, p.y, p.z);
    landAt(L.f, L.u, L.v);
    setMode("ground");
  });

  // ---------- moving around ----------
  function landAt(f, u, v) {
    home = f;
    frame.copy(faceMat[f]);
    const p = [0, 0, 0]; gen.basePoint(f, u, v, p);
    origin.set(p[0], p[1], p[2]);
    updateRoot();
    const h = Math.max(gen.columnAt(f, u, v).h, 0);
    controls.target.set(0, h + 2, 0);
    camera.position.set(70, h + 60, 90);
    controls.update();
    for (const e of chunks.values()) dropChunk(e);
    chunks.clear();
    refreshDesired(true);
    requestFar();
  }

  function rehomeIfNeeded() {
    const t = controls.target;
    // keep numbers small: slide the origin along with the focus
    if (t.x * t.x + t.z * t.z > 48 * 48) {
      const shift = new THREE.Vector3(t.x, 0, t.z);
      origin.add(shift.clone().applyMatrix4(frame));
      camera.position.sub(shift); t.sub(shift);
      updateRoot();
    }
    // walked over an edge onto another face? Turn the frame so that face is "up",
    // keeping the camera in the same place relative to the ground (like gravity switching).
    const L = columnUnder(t.x, t.z);
    if (L.f !== home) {
      const off = camera.position.clone().sub(t);
      // tip the frame over the edge: the smallest rotation taking the old face's up to the new one's
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(...FACES[home].N), new THREE.Vector3(...FACES[L.f].N));
      frame.premultiply(new THREE.Matrix4().makeRotationFromQuaternion(q));
      home = L.f;
      const p = [0, 0, 0]; gen.basePoint(L.f, clampF(L.u), clampF(L.v), p);
      origin.set(p[0], p[1], p[2]);
      updateRoot();
      const c = gen.columnAt(L.f, clampF(L.u), clampF(L.v));
      t.set(0, Math.max(c.h, 0) + 2, 0);
      camera.position.copy(t).add(off);
      controls.update();
      refreshDesired(true);
      requestFar();
    }
  }

  // keyboard and touch pad
  const keys = new Set();
  window.addEventListener("keydown", (e) => { if (e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") keys.add(e.key.toLowerCase()); });
  window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
  const padDirs = new Set();
  for (const b of document.querySelectorAll(".pad [data-dir]")) {
    const d = b.dataset.dir;
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); padDirs.add(d); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => padDirs.delete(d));
  }
  let fast = false;
  document.getElementById("fast").addEventListener("click", (e) => { fast = !fast; e.currentTarget.setAttribute("aria-pressed", String(fast)); });

  function move(dt) {
    let fx = 0, fz = 0;
    if (keys.has("w") || keys.has("arrowup") || padDirs.has("up")) fz -= 1;
    if (keys.has("s") || keys.has("arrowdown") || padDirs.has("down")) fz += 1;
    if (keys.has("a") || keys.has("arrowleft") || padDirs.has("left")) fx -= 1;
    if (keys.has("d") || keys.has("arrowright") || padDirs.has("right")) fx += 1;
    if (!fx && !fz) return;
    const fwd = new THREE.Vector3().subVectors(controls.target, camera.position); fwd.y = 0; fwd.normalize();
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const dist = camera.position.distanceTo(controls.target);
    const speed = Math.max(20, dist * 0.9) * (fast || keys.has("shift") ? 8 : 1) * dt;
    const step = fwd.multiplyScalar(-fz * speed).add(right.multiplyScalar(fx * speed));
    controls.target.add(step); camera.position.add(step);
  }

  // follow the ground height under the focus
  let lastGround = 0;
  function followGround(now) {
    if (now - lastGround < 120) return;
    lastGround = now;
    const t = controls.target;
    const L = columnUnder(t.x, t.z);
    const c = gen.columnAt(L.f, clampF(L.u), clampF(L.v));
    const want = Math.max(c.h, 0) + 2;
    const dy = (want - t.y) * 0.35;
    t.y += dy; camera.position.y += dy;
    where(L, c);
  }

  function where(L, c) {
    const bi = PlanetGen.BIOMES[c.b];
    document.getElementById("where").innerHTML =
      `<b>${bi[1]}</b> on face <b>${FACES[L.f].id}</b><br>Block ${Math.round(clampF(L.u)).toLocaleString()}, ${Math.round(clampF(L.v)).toLocaleString()} of ${F.toLocaleString()} · height ${Math.round(c.h)}`;
  }

  // ---------- UI ----------
  let xray = false;
  document.getElementById("xray").addEventListener("click", (e) => {
    xray = !xray; e.currentTarget.setAttribute("aria-pressed", String(xray));
    for (const ent of chunks.values()) for (const m of ent.meshes) m.visible = m.userData.surface || xray;
  });
  document.getElementById("dist").addEventListener("change", () => { refreshDesired(true); if (scene.fog) { scene.fog.near = fogNear(); } });
  document.getElementById("m-globe").addEventListener("click", () => setMode("globe"));
  document.getElementById("m-ground").addEventListener("click", () => setMode("ground"));
  document.getElementById("land").addEventListener("click", () => { const s = niceSpot(Math.random); landAt(s.f, s.u, s.v); });
  const fold = document.getElementById("fold"), body = document.getElementById("body");
  fold.addEventListener("click", () => { body.hidden = !body.hidden; fold.textContent = body.hidden ? "Show" : "Hide"; fold.setAttribute("aria-expanded", String(!body.hidden)); });
  document.getElementById("go").addEventListener("click", () => newPlanet());
  document.getElementById("seed").addEventListener("keydown", (e) => { if (e.key === "Enter") newPlanet(); });
  document.getElementById("rand").addEventListener("click", () => { document.getElementById("seed").value = Math.floor(Math.random() * 1e6); newPlanet(); });
  document.getElementById("size").addEventListener("change", () => newPlanet());
  function hint() {
    document.getElementById("hint").textContent = mode === "globe"
      ? "Drag to spin the planet · tap anywhere to land there"
      : (touch ? "Drag to look · pinch to zoom · arrows to travel (×8 for fast)" : "Drag to look · scroll to zoom · WASD or arrows to travel, hold Shift for fast");
  }

  // a good first landing spot: land with a mix of biomes, chosen deterministically from the seed
  function niceSpot(rnd) {
    let best = null;
    for (let k = 0; k < 160; k++) {
      const f = Math.floor(rnd() * 6), u = 256 + rnd() * (F - 512), v = 256 + rnd() * (F - 512);
      const set = new Set(); let land = 0, high = 0;
      for (let a = -96; a <= 96; a += 48) for (let b = -96; b <= 96; b += 48) {
        const c = gen.columnAt(f, u + a, v + b); set.add(c.b); if (c.h > 1) land++; if (c.h > 30) high++;
      }
      const s = Math.min(set.size, 5) + land / 6 + Math.min(high, 4) * 0.4;
      if (!best || s > best.s) best = { s, f, u, v };
    }
    return best;
  }
  function seeded(s) { let a = s | 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function newPlanet() {
    SEED = parseInt(document.getElementById("seed").value, 10) || 0;
    F = parseInt(document.getElementById("size").value, 10); R = F / 2;
    genId++;
    gen = PlanetGen.create(SEED, { faceSize: F, chunkSize: CS });
    const info = META.blocks;
    for (const w of workers) { w.busy = 0; w.postMessage({ type: "init", seed: SEED, F, info, atlas: META.atlas, ID }); }
    for (const e of chunks.values()) dropChunk(e);
    chunks.clear(); queue = [];
    if (globeMesh) { globeGroup.remove(globeMesh); globeMesh.geometry.dispose(); globeMesh = null; }
    stat = { gen: 0, mesh: 0, n: 0, tris: 0 };
    const s = niceSpot(seeded(SEED));
    landAt(s.f, s.u, s.v);
    if (mode === "globe") requestGlobe();
    if (scene.fog) scene.fog.far = fogFar();
  }

  // ---------- loop ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    gCam.aspect = w / h; gCam.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  let last = performance.now(), lastRefresh = 0, frames = 0, fpsAt = last, fps = 0, farFrom = null;
  const statsEl = document.getElementById("stats"), busyEl = document.getElementById("busy");
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (mode === "ground") {
      move(dt);
      controls.update();
      rehomeIfNeeded();
      followGround(now);
      if (now - lastRefresh > 300) { lastRefresh = now; refreshDesired(false); }
      const t = controls.target, uvF = homeUV(t.x, t.z), pF = [0, 0, 0];
      gen.basePoint(home, uvF[0], uvF[1], pF);
      if (farAt && farAt.distanceTo(new THREE.Vector3(...pF)) > 900) requestFar();
      renderer.render(scene, camera);
    } else {
      gControls.update();
      renderer.render(scene, gCam);
    }
    frames++;
    if (now - fpsAt > 500) {
      fps = Math.round(frames * 1000 / (now - fpsAt)); frames = 0; fpsAt = now;
      let ready = 0, tris = 0;
      for (const e of chunks.values()) if (e.state === "ready") { ready++; for (const m of e.meshes) if (m.visible) tris += m.geometry.index.count / 3; }
      statsEl.innerHTML = `<b>${fps}</b> fps · chunks <b>${ready}</b>/${desired.size}<br>` +
        `${stat.n ? (stat.gen / stat.n).toFixed(0) : "–"} ms build + ${stat.n ? (stat.mesh / stat.n).toFixed(0) : "–"} ms mesh per chunk · ${NW} threads<br>` +
        `${(tris / 1000).toFixed(0)}k triangles drawn`;
      busyEl.hidden = ready > 0 || mode === "globe";
    }
    requestAnimationFrame(loop);
  }

  window.cc = {
    ready: () => { let r = 0; for (const e of chunks.values()) if (e.state === "ready") r++; return r >= desired.size && desired.size > 0 && !!farMesh; },
    globeReady: () => !!globeMesh,
    mode: setMode,
    goto: (f, u, v) => landAt(f, u, v),
    look: (pos, target) => { camera.position.set(...pos); controls.target.set(...target); controls.update(); },
    gcam: (pos) => { gCam.position.set(...pos); gControls.update(); },
    xray: () => document.getElementById("xray").click(),
    walk: (dx, dz) => { controls.target.x += dx; controls.target.z += dz; camera.position.x += dx; camera.position.z += dz; controls.update(); rehomeIfNeeded(); lastGround = 0; followGround(performance.now()); },
    lookRel: (off) => { const t = controls.target; camera.position.set(t.x + off[0], t.y + off[1], t.z + off[2]); controls.update(); },
    state: () => { const t = controls.target, L = columnUnder(t.x, t.z); return { home, desired: desired.size, face: FACES[L.f].id, u: Math.round(L.u), v: Math.round(L.v) }; },
  };

  hint();
  newPlanet();
  requestAnimationFrame(loop);
})();
</script>
