<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stud City Incremental</title>
<meta name="description" content="Playable HTML rough draft of Stud City Incremental on the full Upgrade Land engine, with a dev bar to max or simulate the next plot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/stud.css">
</head>
<body>
<canvas id="world" aria-label="Stud City world"></canvas>
<!-- post layers: colour grade, tilt-shift blur bands, vignette, flash, cinema bars -->
<div id="grade"></div>
<div id="tilt"><div class="tilt-top"></div><div class="tilt-bot"></div></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="letterbox"><div class="lb-top"></div><div class="lb-bot"></div></div>
<!-- cinematic caption card and skip button (intro and tour) -->
<div id="cineCap"><div class="ck"></div><div class="ct"></div></div>
<button id="cineSkip" class="dbtn">SKIP &#9656;&#9656;</button>

<header id="devbar">
  <span class="devchip">DEV</span>
  <button class="dbtn primary" id="dvMax" title="Set every machine on the next unfinished plot to its max level">MAX NEXT PLOT</button>
  <button class="dbtn" id="dvSim" title="Let the bot play at warp speed until a new plot is built, then report the play time">SIM TO NEXT PLOT</button>
  <button class="dbtn" id="dvSpeed" title="Game speed">SPEED x1</button>
  <button class="dbtn" id="dvBot" title="Bot plays for you at the current speed">BOT OFF</button>
  <button class="dbtn lab" id="dvLab" title="Every effect, sound, haptic and UI motion with its spec and Roblox recipe">FX LAB</button>
  <button class="dbtn" id="dvTimeline">TIMELINE</button>
  <button class="dbtn" id="dvWeather" title="Cycle the weather">WEATHER: AUTO</button>
  <button class="dbtn" id="dvTime" title="Skip 6 hours of the day and night cycle">TIME +6H</button>
  <button class="dbtn" id="dvAway" title="Pretend you were away for 1 hour to test the offline cap">AWAY 1H</button>
  <button class="dbtn" id="dvNames" title="Switch between Stud City and Upgrade Land names">NAMES: STUD</button>
  <span class="devclock" id="dvClock">0s</span>
</header>

<div id="hud">
  <div id="topleft">
    <div class="hero" id="hero" role="button" tabindex="0" title="Open stats">
      <span class="medal"><img class="hero-icon" id="heroIcon" alt=""></span>
      <div class="hero-text">
        <div class="hero-label" id="heroLabel">STUDS</div>
        <div class="hero-num" id="heroNum">0</div>
      </div>
      <div class="rate-pill" id="heroRate">+0/s</div>
    </div>
    <div class="stack" id="stack"></div>
    <button class="more dbtn" id="stackMore">MORE</button>
  </div>

  <button id="guide" class="guide card c-gold" title="Your next goal"><span class="g-icon medal" id="guideIcon">&#9650;</span><span class="g-text"><span class="g-kick">NEXT GOAL</span><b id="guideText">Tap the blueprint</b><i id="guideSub"></i></span><span class="g-go shine">GO</span></button>

  <nav id="tiles">
    <button class="tile card t-reset" id="tReset"><span class="ticon">&#10227;</span><span class="tl">REBUILD</span><b class="badge hidden" id="tResetBadge">0</b></button>
    <button class="tile card t-index" id="tIndex"><span class="ticon">&#9638;</span><span class="tl">PLOTS</span></button>
    <button class="tile card t-badge" id="tBadges"><span class="ticon">&#9733;</span><span class="tl">BADGES</span><b class="badge hidden" id="tBadgeCount">0</b></button>
    <button class="tile card t-codes" id="tCodes"><span class="ticon">&#10022;</span><span class="tl">CODES</span><b class="badge hidden" id="tCodeBadge">!</b></button>
    <button class="tile card t-set" id="tSet"><span class="ticon">&#9881;</span><span class="tl">SETTINGS</span></button>
  </nav>

  <div id="leftdock">
    <div class="mm-wrap frame" id="mmWrap"><canvas id="minimap" width="180" height="132" aria-label="Minimap"></canvas><span class="mm-label">MAP</span></div>
    <div class="dock-btns">
      <button class="dock card walk" id="btnWalk" title="Walk mode (V)"><span class="ticon">&#9823;</span><span>WALK</span></button>
      <button class="dock card photo" id="btnPhoto" title="Photo mode (P)"><span class="ticon">&#9673;</span><span>PHOTO</span></button>
    </div>
  </div>

  <div id="camctl" class="frame">
    <button class="cbtn" id="camL" title="Turn left (Q)">&#10226;</button>
    <input type="range" id="camRot" min="-180" max="180" step="1" value="0" aria-label="Turn the map">
    <button class="cbtn" id="camR" title="Turn right (E)">&#10227;</button>
    <button class="cbtn" id="camOut" title="Zoom out">&minus;</button>
    <button class="cbtn" id="camIn" title="Zoom in">+</button>
    <button class="cbtn" id="camHome" title="Back to the focused plot">&#8962;</button>
  </div>

  <div id="zonebar" class="frame">
    <div class="zb-info">
      <div class="zb-tab" id="zbTab">STUD SQUARE</div>
      <div class="zb-rate" id="zbRate">+0 Studs/s</div>
      <div class="zb-lv"><div class="zb-bar"><i id="zbFill"></i></div><span id="zbLv">LV 0/0</span></div>
    </div>
    <div class="zb-buy">
      <div class="seg" id="buySeg">
        <button data-m="1" class="on">X1</button><button data-m="5">X5</button><button data-m="10">X10</button><button data-m="MAX">MAX</button>
      </div>
      <button class="buyall" id="buyAll">BUY ALL</button>
    </div>
  </div>
</div>

<!-- walk mode controls (touch) -->
<div id="walkui">
  <div id="joy"><div id="joyKnob"></div></div>
  <button id="btnJump" class="wbtn">JUMP</button>
  <button id="btnAct" class="wbtn act">USE</button>
  <button id="btnWalkExit" class="dbtn">EXIT WALK</button>
</div>

<!-- photo mode toolbar -->
<div id="photobar" class="frame">
  <span class="pb-title">PHOTO MODE</span>
  <label class="pb-l">TIME <input type="range" id="pbTime" min="0" max="24" step="0.1"></label>
  <div class="seg" id="pbFilter"><button data-f="none" class="on">NONE</button><button data-f="warm">WARM</button><button data-f="cool">COOL</button><button data-f="vivid">VIVID</button><button data-f="noir">NOIR</button></div>
  <button class="dbtn" id="pbTilt">TILT: ON</button>
  <button class="dbtn" id="pbHud">HIDE ALL</button>
  <button class="dbtn" id="pbTour" title="Fly over every plot you have built">TOUR</button>
  <button class="dbtn primary" id="pbSnap">SNAP</button>
  <button class="dbtn" id="pbExit">EXIT</button>
</div>

<section id="sheet" class="sheet frame hidden" aria-live="polite"></section>
<section id="panel" class="panel hidden"><div class="pwrap"><nav class="rail" id="panelRail" aria-label="Sections"></nav><div class="panel-card frame"><div class="frame-title"><span class="ft-icon card" id="panelIcon"></span><h2 id="panelTitle"></h2></div><button class="x" id="panelX" aria-label="Close">X</button><div class="panel-body" id="panelBody"></div><div class="panel-foot" id="panelFoot"></div></div></div></section>
<aside id="drawer" class="drawer hidden"><header class="panel-head"><h2 id="drawerTitle">FX LAB</h2><button class="x" id="drawerX" aria-label="Close">X</button></header><div class="drawer-tabs" id="drawerTabs"></div><div class="panel-body" id="drawerBody"></div></aside>
<div id="toasts"></div>
<div id="badgePop" class="card c-gold"><span class="bp-icon medal">&#9733;</span><div><div class="bp-kicker">BADGE UNLOCKED</div><div class="bp-name">Name</div><div class="bp-desc">Desc</div></div></div>
<!-- milestone takeover: sunburst, kicker, number in words, currency -->
<div id="milestone" aria-live="polite"><div class="ms-burst"></div><div class="ms-k">MILESTONE</div><div class="ms-n">ONE MILLION</div><div class="ms-c">STUDS</div></div>
<div id="banner" class="hidden"><div class="b1">NEW PLOT!</div><div class="b2" id="bannerName"></div></div>
<section id="modal" class="modal hidden"><div class="modal-card frame" id="modalCard"></div></section>
<div id="simbox" class="frame hidden">
  <div class="sim-title">BOT IS PLAYING</div>
  <div class="sim-time" id="simTime">0s</div>
  <div class="sim-sub" id="simSub">looking for the next plot</div>
  <button class="dbtn" id="simStop">STOP</button>
</div>

<!-- title screen -->
<section id="title">
  <div class="t-sky"></div>
  <div class="t-logo" aria-label="Stud City Incremental">
    <div class="t-row" id="tRow1"></div>
    <div class="t-row small" id="tRow2"></div>
  </div>
  <div class="t-bar"><i id="tBar"></i></div>
  <div class="t-tip" id="tTip">Laying the baseplates...</div>
  <button class="t-play" id="tPlay" disabled>TAP TO PLAY</button>
  <div class="t-foot">Rough draft on the Upgrade Land engine by Andy175. Same math, new world.</div>
</section>

<script src="js/ul-data.js"></script>
<script src="js/format.js"></script>
<script src="js/engine.js"></script>
<script src="js/plots.js"></script>
<script src="js/bot.js"></script>
<script src="js/benchmark.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/fx.js"></script>
<script src="js/meta.js"></script>
<script src="js/props.js"></script>
<script src="js/env.js"></script>
<script src="js/walk.js"></script>
<script src="js/city.js"></script>
<script src="js/sky.js"></script>
<script src="js/hud.js"></script>
<script src="js/ui-extras.js"></script>
<script src="js/cine.js"></script>
<script src="js/lab.js"></script>
<script src="js/main.js"></script>
</body>
</html>
