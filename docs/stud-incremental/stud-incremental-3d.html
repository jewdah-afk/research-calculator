<title>Stud Incremental World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D world map. HUD chips top-left, detail panel right (bottom sheet on phones), minimap bottom-left, progression scrubber bottom. Single committed look: stud-sea world, navy + coral UI taken from the Stack pedestal. */
:root{
  color-scheme: dark;
  --ink:#0E1424; --ink2:#18223A; --line:#2B3A5E;
  --coral:#FF5B4D; --peach:#FFC8A8;
  --text:#F2F5FF; --mid:#A9B4D0; --low:#6D7A9C;
  --ok:#6BE38F; --warn:#FF8A65;
  --tS:#FFD84A; --tA:#FF5B4D; --tB:#7FD6FF; --tC:#A9B4D0;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#7EC3F0;color:var(--text);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
canvas#world{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.ui{position:absolute;inset:0;z-index:2;pointer-events:none;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(14px,env(safe-area-inset-bottom,0px))}
.ui>*{pointer-events:auto}
.card{background:rgba(14,20,36,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(8,12,30,.35)}

.brand{position:absolute;left:16px;top:max(14px,env(safe-area-inset-top,0px));padding:10px 14px;display:flex;gap:12px;align-items:center}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.06em;margin:0;line-height:1}
.brand p{margin:3px 0 0;font-size:12px;color:var(--mid)}
.views{position:absolute;left:16px;top:78px;display:flex;gap:6px;flex-wrap:wrap}
.vbtn{background:rgba(14,20,36,.85);border:1px solid var(--line);color:var(--mid);font-weight:800;font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer;font-family:var(--f-body)}
.vbtn[aria-pressed=true]{color:var(--text);border-color:var(--coral);background:var(--ink2)}
.hud{position:absolute;left:16px;top:120px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100% - 440px))}
.chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;background:rgba(14,20,36,.82);border:1px solid var(--line);font-size:12px;font-weight:700;animation:pop .35s ease-out}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--c)}
.ico{width:16px;height:16px;border-radius:4px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.45);flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.panel{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 130px);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--mid);font-family:var(--f-display);font-size:11px;letter-spacing:.1em;padding:12px 6px;cursor:pointer}
.tab[aria-selected=true]{color:var(--text);box-shadow:inset 0 -2px 0 var(--coral)}
.pbody{overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--low);font-weight:800}
.zname{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;margin:2px 0 0;color:var(--zc,var(--text))}
.row{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--ink2);border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:rgba(107,227,143,.4)} .pill.off{color:var(--warn);border-color:rgba(255,138,101,.4)}
.pill.tier{color:var(--tc);border-color:var(--tc)}
.facts{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:13px}
.facts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 10px;background:var(--ink2);border-radius:6px}
.facts li span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--peach);text-align:right}
.blurb{font-size:13px;line-height:1.55;color:var(--mid);margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--low);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid rgba(43,58,94,.5)}
.tbl td.n{font-family:var(--f-mono);color:var(--peach)}
.flag{font-size:12px;color:var(--warn);border-left:2px solid var(--warn);padding-left:10px;margin:0}
.rung{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--ink2);border-left:3px solid var(--rc);cursor:pointer}
.rung h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--rc);display:flex;justify-content:space-between;gap:8px}
.rung h3 span{font-family:var(--f-mono);font-size:10px;color:var(--tc)}
.rung .g{font-family:var(--f-mono);font-size:11px;color:var(--mid)}
.rung .l,.rung .k{font-size:12px;color:var(--mid)}
.rung .l b{color:var(--warn)} .rung .k b{color:var(--ok)}
.legend{display:grid;gap:8px}
.legend div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:13px;color:var(--mid)}
.legend b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--tc);text-align:center;border:1px solid var(--tc);border-radius:6px;line-height:30px}
.legend strong{color:var(--text);display:block}
.hint{font-size:12px;color:var(--low);margin:0}

.mini{position:absolute;left:16px;bottom:112px;padding:8px}
.mini canvas{display:block;width:150px;height:270px;cursor:pointer;border-radius:6px}
.mini .cap{font-size:10px;letter-spacing:.14em;color:var(--low);font-weight:800;text-transform:uppercase;margin:0 0 6px 2px}

.scrub{position:absolute;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom,0px));margin:0 auto;max-width:900px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center}
.now{font-family:var(--f-display);font-size:16px;letter-spacing:.04em;min-width:150px}
.now small{display:block;font-family:var(--f-body);font-size:11px;color:var(--mid);letter-spacing:0;font-weight:700}
.btns{display:flex;gap:6px}
.btn{background:var(--ink2);border:1px solid var(--line);color:var(--text);border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-weight:800;cursor:pointer;font-family:var(--f-body)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#1a0a08}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
.ticks{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--low);margin-top:-6px}
button:focus-visible,input:focus-visible,.lbl:focus-visible,.rung:focus-visible{outline:2px solid var(--peach);outline-offset:2px}

.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;border-radius:7px;background:rgba(14,20,36,.84);border:1px solid rgba(255,255,255,.12);color:#fff;display:flex;gap:6px;align-items:center;font-weight:800}
.lbl .ico{width:11px;height:11px;border-radius:3px}
.lbl .t{font-family:var(--f-mono);font-size:9px;padding:1px 4px;border-radius:3px;color:#0E1424;background:var(--tc)}
.lbl.S{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.06em;padding:7px 12px;border:2px solid var(--tS);box-shadow:0 0 18px rgba(255,216,74,.45)}
.lbl.A{font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.05em;padding:6px 10px;border:1.5px solid var(--tA)}
.lbl.B{font-size:12px;padding:4px 8px}
.lbl.C{font-size:11px;padding:3px 7px;background:rgba(14,20,36,.7)}
.lbl.locked{color:#aab3c8;background:rgba(40,46,64,.72);box-shadow:none}
.lbl.locked::after{content:"LOCKED";font-family:var(--f-body);font-weight:800;font-size:9px;letter-spacing:.1em;color:var(--warn)}
.lbl.sel{outline:2px solid var(--coral);outline-offset:2px}

.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(22px,5vw,44px);letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,91,77,.8);pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,-60%)}
.toast small{display:block;font-family:var(--f-body);font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--peach);white-space:normal}
#err{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:#0E1424;color:var(--mid);font-size:14px;z-index:5}

@media (max-width:980px){ .hud{max-width:calc(100% - 32px)} .mini{display:none} }
@media (max-width:760px){
  .brand{padding:8px 12px}.brand h1{font-size:15px}.brand svg{width:28px;height:28px}
  .views{top:62px;flex-wrap:nowrap;overflow-x:auto;max-width:calc(100% - 32px)}.vbtn{padding:6px 9px;font-size:11px;flex:none}.hud{top:100px}.hud .chip:nth-child(n+5){display:none}
  .panel{top:auto;bottom:124px;right:16px;left:16px;width:auto;max-height:30vh}
  .scrub{grid-template-columns:1fr auto;padding:10px 12px}.now{grid-column:1/-1;min-width:0}.ticks{display:none}
  .lbl.S{font-size:13px;padding:5px 9px}.lbl.A{font-size:11px}.lbl.B,.lbl.C{font-size:10px}
}
@media (prefers-reduced-motion:reduce){.chip{animation:none}.toast{transition:none}}
</style>

<div id="app">
  <canvas id="world" aria-label="3D low-poly map of Stud Incremental"></canvas>
  <div id="labels"></div>
  <div class="ui">
    <div class="brand card">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="14" width="34" height="22" rx="3" fill="#E8453C"/><rect x="3" y="30" width="34" height="6" rx="2" fill="#B8322B"/><rect x="8" y="8" width="9" height="8" rx="2" fill="#FF7A6B"/><rect x="23" y="8" width="9" height="8" rx="2" fill="#FF7A6B"/></svg>
      <div><h1>STUD INCREMENTAL</h1><p>World map · Brickhaven &amp; The Glacier</p></div>
    </div>
    <div class="views" role="group" aria-label="Camera views">
      <button class="vbtn" data-v="overview" aria-pressed="true">Overview</button>
      <button class="vbtn" data-v="r1" aria-pressed="false">Brickhaven</button>
      <button class="vbtn" data-v="r2" aria-pressed="false">The Glacier</button>
      <button class="vbtn" data-v="top" aria-pressed="false">Top-down</button>
    </div>
    <div class="hud" id="hud"></div>

    <aside class="panel card" aria-label="Details">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabZone" aria-selected="true">PLACE</button>
        <button class="tab" role="tab" id="tabResets" aria-selected="false">RESETS</button>
        <button class="tab" role="tab" id="tabKey" aria-selected="false">MAP KEY</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>

    <div class="mini card"><p class="cap">Map · tap to travel</p><canvas id="mini" width="300" height="540" aria-label="Minimap"></canvas></div>

    <div class="scrub card">
      <div class="now" id="now">STACK 7<small>~67 min in</small></div>
      <input id="step" type="range" min="0" max="15" step="1" value="7" aria-label="Progression">
      <div class="btns">
        <button class="btn" id="prev" aria-label="Previous step">◀</button>
        <button class="btn primary" id="play">PLAY</button>
        <button class="btn" id="next" aria-label="Next step">▶</button>
      </div>
      <div class="ticks" aria-hidden="true"><span>S0</span><span>S2</span><span>S4</span><span>S6</span><span>S8</span><span>S10</span><span>REBIRTH</span><span>S12</span><span>ENDGAME</span></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="err">The 3D map needs WebGL. Try a current browser on a device with graphics acceleration.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script>
(() => {
if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').style.display='grid'; return; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   DATA — stud names from the icon sheet, numbers from the balance sheet
   ===================================================================== */
const C = { studs:'#D9DDE6', bricks:'#E8453C', welds:'#8FA3C0', bp:'#2FBF5B', oofs:'#FFD23F', gems:'#8A4DFF',
  cyl:'#17B3A3', balls:'#FF3FA4', tix:'#F2B63D', glass:'#7FD6FF', glacier:'#4AA8FF', plate:'#C9D2DE',
  ff:'#B07CFF', frost:'#9FD8FF', neon:'#5BE04A', foil:'#FF8FD0', light:'#FFD84A', refl:'#BFD9FF',
  spark:'#FFB347', fog:'#B9B3E6', meteor:'#FF6A2B', loot:'#D99A2B', level:'#3E8BFF', stack:'#FF5B4D',
  obby:'#FF9A2E', rebirth:'#A24DFF', anchor:'#3F7BFF', union:'#34D6B0', publish:'#2FA8FF', noob:'#FFD23F', crate:'#C97B3A', tools:'#E0782A', thr:'#FF7A2B', hats:'#9B3DFF', gate:'#9FE0FF', spawn:'#FFFFFF' };
const TIERS = { S:{n:'Realm reset', d:'Changes the whole run. Giant monument on the highest ground, sky beam, seen from anywhere.', c:'#FFD84A'},
  A:{n:'Reset', d:'Wipes part of your progress for a permanent boost. Big landmark with its own plaza and glowing gate.', c:'#FF5B4D'},
  B:{n:'Generator', d:'Makes a currency or opens a system. A building with a stand-on pad.', c:'#7FD6FF'},
  C:{n:'Utility', d:'Timers, claims and helpers. Small props along the paths.', c:'#A9B4D0'} };

const STEPS = [
  {name:'STACK 0', t:'Just spawned', stack:0}, {name:'STACK 1', t:'6 s', stack:1}, {name:'STACK 2', t:'~1–2 min', stack:2},
  {name:'STACK 3', t:'5.5 min', stack:3}, {name:'STACK 4', t:'~10 min', stack:4}, {name:'STACK 5', t:'~17 min', stack:5},
  {name:'STACK 6', t:'~27 min', stack:6}, {name:'STACK 7', t:'~67 min', stack:7}, {name:'STACK 8', t:'~1.4 h', stack:8},
  {name:'STACK 9', t:'~1.8 h', stack:9}, {name:'STACK 10', t:'~3.1 h', stack:10},
  {name:'REBIRTH', t:'~7.1 h · Studs > 1e2283', stack:10},
  {name:'STACK 11', t:'~0.5 day · Anchors I–III', stack:11, anchor:3},
  {name:'STACK 12', t:'+1.4 days · Anchors IV–VI', stack:12, anchor:6},
  {name:'STACK 13', t:'Max Stack · Anchors VII–IX', stack:13, anchor:9},
  {name:'ENDGAME', t:'Union 1000 · Publish 3 · Reflectance', stack:13, anchor:9, end:true},
];
const STUDS_AT=['88','4.1e5','2.2e9','8.0e14','3.3e23','6.1e39','2.0e64','2.41e152','5.5e275','3.0e977','1.1e1500','9.4e2282','4.2e3100','8.8e3400','1.9e3610','2.5e3900'];
const CUR = [
  ['Studs',C.studs,0,u=>STUDS_AT[u]],
  ['Bricks',C.bricks,1,u=>['','4.4e3','9.1e8','2.6e14','1.2e22','3.3e38','8.0e62','1.2e40','7.7e90','2.1e160','6.0e300','9.9e999','1.4e1400','3.0e1700','8.1e2000','5.0e2400'][u]],
  ['Build Points',C.bp,1,u=>['','12','3.1e3','8.8e5','4.0e8','6.2e11','9.0e14','3.1e21','7.5e40','1.1e88','5.0e140','8.1e260','9.9e500','2.2e800','6.0e1100','1.0e1500'][u]],

  ['Welds',C.welds,2,u=>['','','6','2.1e4','8.8e9','1.4e19','6.0e27','8.8e33','2.1e60','9.0e110','4.4e180','8.8e300','2.0e500','7.0e800','1.2e1100','4.0e1500'][u]],
  ['Oofs',C.oofs,4,u=>['','','','','930','4.0e7','1.1e14','5.5e21','2.0e40','8.8e77','3.0e130','9.0e250','1.0e400','5.0e700','7.0e900','2.0e1300'][u]],
  ['Gems',C.gems,5,u=>['','','','','','40','9.9e3','7.0e12','3.3e18','1.2e24','8.0e29','4.1e31','1.1e36','9.0e40','4.4e45','3.0e120'][u]],
  ['Cylinders',C.cyl,7,u=>['','','','','','','','850','3.0e8','9.1e19','4.0e42','8.0e90','1.0e140','3.0e200','9.0e260','1.0e300'][u]],
  ['Crates',C.crate,8,u=>['','','','','','','','','Lv 12','Lv 41','Lv 180','Lv 900','Lv 1.3e3','Lv 1.4e3','Lv 1.5e3','Lv 2.0e3'][u]],
  ['Balls',C.balls,9,u=>['','','','','','','','','','2.5e6','7.7e30','1.1e75','5.0e120','9.0e190','3.0e260','9.0e300'][u]],
  ['Glass',C.glass,11,u=>['','','','','','','','','','','','1.0','4.0e30','9.0e110','3.0e200','1.0e260'][u]],
  ['Glacier',C.glacier,11,u=>['','','','','','','','','','','','2','8.0e20','4.0e60','1.0e110','4.0e150'][u]],
  ['Diamond Plate',C.plate,12,u=>['','','','','','','','','','','','','3.0e9','8.0e25','5.0e40','2.0e60'][u]],

  ['Neon',C.neon,15,()=> '4.0e26'], ['Foil',C.foil,15,()=> '6.6e80'], ['Lighting',C.light,15,()=> '2.0e22'], ['Reflectance',C.refl,15,()=> '4.1e3'],
];
const HAT_PACKS = [
  ['Beginner','1 Tix','Stack 1',1,'#3DA5FF'],['Royal','50 Tix','Stack 1',1,'#F2B63D'],['Basic','1e3 Bricks','Stack 3',3,'#E8453C'],
  ['Color','2.5e4 Build Points','Stack 6',6,'#FF3FA4'],['Nature','5e27 Balls','Stack 9',9,'#3FBF4F'],['Polychrome','1e15 Gems','Rebirth',11,'#B07CFF'],
  ['Cryo','50 Frost Points','Rebirth + Anchor III',12,'#9FD8FF'],['Arctic','1e6 Neon','Union 7',15,'#5BE04A'],['Galactic','500 Tix','Union 750',15,'#9B3DFF'] ];
const TIER_COST=[['0','100 Studs'],['1','1e6 Studs'],['2','5e9 Studs'],['3','2.5e15 Studs'],['4','7.5e23 Studs'],['5','1e40 Studs'],['6','1e65 Studs'],['7','1e153 Studs'],['8','1e276 Studs'],['9','1e978 Studs'],['10','1e52 Glass'],['11','7.5e113 Glass'],['12','1e195 Glass'],['13','hard cap']];
const ANCHORS=[['I','1e19','S11'],['II','2.5e34','S11'],['III','5e51','S11'],['IV','2.5e109','S12'],['V','7.5e136','S12'],['VI','2.5e185','S12'],['VII','1e234','S13'],['VIII','5e278','S13'],['IX','2 ⚠','S13']];
const UNION=[['1','1e43'],['2','1e50'],['3','1e55'],['4','1e60'],['5','1e65'],['6','1e70'],['7','1e85'],['8','1e95'],['9','1e105'],['10','5e178'],['11+','≈1e89 ⚠']];

/* =====================================================================
   RENDERER
   ===================================================================== */
const canvas=document.getElementById('world');
let renderer; try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }catch(e){ document.getElementById('err').style.display='grid'; return; }
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  zones.forEach(z=>{ const p=new THREE.Vector3(); z.group.getWorldPosition(p); const [x,y]=m2c(p.x,p.z); const r={S:11,A:8,B:5.5,C:4}[z.tier]; const lk=step<z.u;
    mx.beginPath(); if(z.tier==='S'){ for(let i=0;i<10;i++){ const a=i/10*6.28-1.57, rr=i%2?r*.5:r; mx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} } else if(z.tier==='A'){ mx.moveTo(x,y-r); mx.lineTo(x+r,y); mx.lineTo(x,y+r); mx.lineTo(x-r,y); } else mx.arc(x,y,r,0,6.28);
    mx.closePath(); mx.fillStyle=lk?'#7C849A':(z.c==='#FFFFFF'?'#fff':z.c); mx.fill(); mx.lineWidth=z===selected?3:1.5; mx.strokeStyle=z===selected?'#FF5B4D':'#0E1424'; mx.stroke(); });
  const [cx,cy]=m2c(controls.target.x,controls.target.z); mx.strokeStyle='#fff'; mx.lineWidth=2; mx.beginPath(); mx.arc(cx,cy,7,0,6.28); mx.stroke();
  mx.font='bold 17px Nunito, sans-serif'; mx.fillStyle='rgba(14,20,36,.85)'; mx.fillText('BRICKHAVEN',...m2c(-138,128)); mx.fillText('THE GLACIER',...m2c(-138,-395)); }
mini.addEventListener('click',e=>{ const r=mini.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*mini.width, py=(e.clientY-r.top)/r.height*mini.height; let best=null,bd=1e9;
  zones.forEach(z=>{ const p=new THREE.Vector3(); z.group.getWorldPosition(p); const [x,y]=m2c(p.x,p.z); const d=Math.hypot(x-px,y-py); if(d<bd){bd=d;best=z;} }); if(best&&bd<40) select(best); });

/* ---------- scrubber ---------- */
const slider=document.getElementById('step'), playBtn=document.getElementById('play');
slider.addEventListener('input',e=>applyStep(+e.target.value,true));
function stopPlay(){ playing=false; playBtn.textContent='PLAY'; }
document.getElementById('prev').onclick=()=>{ stopPlay(); applyStep(Math.max(0,step-1),false); };
document.getElementById('next').onclick=()=>{ stopPlay(); applyStep(Math.min(15,step+1),true); };
playBtn.onclick=()=>{ if(playing){ stopPlay(); return; } playing=true; playBtn.textContent='PAUSE'; if(step>=15) applyStep(0,false); playT=0; };

/* ---------- loop ---------- */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<700?58:42; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
camera.position.copy(VIEWS.overview[1]); controls.target.copy(VIEWS.overview[0]);
const T0=performance.now(); let last=T0, miniT=0;
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; const t=(now-T0)/1000;
  if(!reduce) anim.forEach(f=>f(t,dt));
  stackBricks.forEach(b=>{ if(b.visible&&b.userData.pop!==undefined&&b.userData.pop<1){ b.userData.pop=Math.min(1,b.userData.pop+(reduce?1:dt*3.2)); const p=b.userData.pop; b.scale.setScalar(Math.max(.001,1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2))); b.position.y=b.userData.baseY+(1-p)*8; } });
  if(playing){ playT+=dt; if(playT>1.7){ playT=0; step<15?applyStep(step+1,true):stopPlay(); } }
  if(fly){ const k0=Math.min(1,(now-fly.s)/1300), k=k0<.5?2*k0*k0:1-Math.pow(-2*k0+2,2)/2; controls.target.lerpVectors(fly.fT,fly.tT,k); camera.position.lerpVectors(fly.fC,fly.tC,k); if(k0>=1) fly=null; }
  controls.update(); renderer.render(scene,camera); updateLabels();
  miniT+=dt; if(miniT>.25){ miniT=0; drawMini(); }
  requestAnimationFrame(frame); }
applyStep(7,false); selected=Zstack; setTab('zone'); requestAnimationFrame(frame);
})();
</script>
