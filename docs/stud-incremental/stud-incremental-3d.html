<title>Stud Incremental World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D stud world. Floating HUD chips top, zone/reset panel right (bottom sheet on phones), progression scrubber bottom. Single committed look: Roblox-sky world, navy + coral UI from the Stack pedestal. */
:root{
  color-scheme: dark;
  --ink:#0E1424;        /* panel ground */
  --ink2:#18223A;       /* raised */
  --line:#2B3A5E;       /* hairline */
  --coral:#FF5B4D;      /* Stack glow, primary accent */
  --peach:#FFC8A8;      /* Stack top brick */
  --text:#F2F5FF; --mid:#A9B4D0; --low:#6D7A9C;
  --ok:#6BE38F; --warn:#FF8A65;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#8FC9F2;color:var(--text);font-family:var(--f-body);overflow:hidden}
#app{position:fixed;inset:0}
canvas#world{display:block;width:100%;height:100%;touch-action:none}
.ui{position:absolute;z-index:2;pointer-events:none;inset:0;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(14px,env(safe-area-inset-bottom,0px))}
.ui>*{pointer-events:auto}
.card{background:rgba(14,20,36,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(8,12,30,.35)}

/* title */
.brand{position:absolute;left:16px;top:max(14px,env(safe-area-inset-top,0px));padding:12px 16px;display:flex;gap:12px;align-items:center}
.brand .logo{width:38px;height:38px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.06em;margin:0;line-height:1}
.brand p{margin:3px 0 0;font-size:12px;color:var(--mid)}

/* HUD chips */
.hud{position:absolute;left:16px;top:86px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(620px,calc(100% - 32px))}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;background:rgba(14,20,36,.82);border:1px solid var(--line);font-size:12px;font-weight:700;animation:pop .35s ease-out}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--c)}
.ico{width:18px;height:18px;border-radius:5px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.45);flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* side panel */
.panel{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top,0px));width:min(380px,calc(100% - 32px));max-height:calc(100% - 150px);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--mid);font-family:var(--f-display);font-size:12px;letter-spacing:.1em;padding:12px 8px;cursor:pointer}
.tab[aria-selected=true]{color:var(--text);box-shadow:inset 0 -2px 0 var(--coral)}
.pbody{overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--low);font-weight:800}
.zname{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:2px 0 0;color:var(--zc,var(--text))}
.zsub{font-size:13px;color:var(--mid)}
.state{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--ink2);border:1px solid var(--line);width:max-content}
.state.on{color:var(--ok);border-color:rgba(107,227,143,.4)}
.state.off{color:var(--warn);border-color:rgba(255,138,101,.4)}
.facts{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:13px}
.facts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 10px;background:var(--ink2);border-radius:6px}
.facts li span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--peach);text-align:right}
.blurb{font-size:13px;line-height:1.55;color:var(--mid);margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--low);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid rgba(43,58,94,.5)}
.tbl td.n{font-family:var(--f-mono);text-align:right;color:var(--peach)}
.flag{font-size:12px;color:var(--warn);border-left:2px solid var(--warn);padding-left:10px;margin:0}
.rung{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--ink2);border-left:3px solid var(--rc)}
.rung h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--rc)}
.rung .g{font-family:var(--f-mono);font-size:11px;color:var(--mid)}
.rung .l{font-size:12px;color:var(--mid)}
.rung .l b{color:var(--warn);font-weight:800}
.rung .k{font-size:12px;color:var(--mid)}
.rung .k b{color:var(--ok);font-weight:800}
.hint{font-size:12px;color:var(--low)}

/* scrubber */
.scrub{position:absolute;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom,0px));margin:0 auto;max-width:880px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center}
.scrub .now{font-family:var(--f-display);font-size:16px;letter-spacing:.04em;min-width:150px}
.scrub .now small{display:block;font-family:var(--f-body);font-size:11px;color:var(--mid);letter-spacing:0;font-weight:700}
.btns{display:flex;gap:6px}
.btn{background:var(--ink2);border:1px solid var(--line);color:var(--text);border-radius:8px;height:36px;min-width:36px;padding:0 10px;font-weight:800;cursor:pointer;font-family:var(--f-body)}
.btn:hover{border-color:var(--coral)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#1a0a08}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
.ticks{grid-column:1/-1;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--low);margin-top:-6px;overflow:hidden}
button:focus-visible,input:focus-visible,.lbl:focus-visible{outline:2px solid var(--peach);outline-offset:2px}

/* world labels */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;padding:4px 9px;border-radius:7px;background:rgba(14,20,36,.82);border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:800;color:#fff;display:flex;gap:6px;align-items:center;transition:opacity .25s}
.lbl .ico{width:12px;height:12px;border-radius:3px}
.lbl.locked{color:#aab3c8;background:rgba(40,46,64,.7)}
.lbl.locked::after{content:"LOCKED";font-size:9px;letter-spacing:.1em;color:var(--warn)}
.lbl.sel{border-color:var(--coral);box-shadow:0 0 0 2px rgba(255,91,77,.35)}

.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(22px,5vw,44px);letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 30px rgba(255,91,77,.8);pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-60%)}
.toast small{display:block;font-family:var(--f-body);font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--peach)}
#err{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;background:#0E1424;color:var(--mid);font-size:14px}

@media (max-width:760px){
  .brand{padding:9px 12px}.brand h1{font-size:16px}.brand .logo{width:30px;height:30px}
  .hud{top:66px}
  .panel{top:auto;bottom:128px;right:16px;left:16px;width:auto;max-height:30vh}
  .hud .chip:nth-child(n+7){display:none}
  .scrub{grid-template-columns:1fr auto;padding:10px 12px}
  .scrub .now{grid-column:1/-1;min-width:0}
  .ticks{display:none}
  .lbl{font-size:11px;padding:3px 7px}
}
@media (prefers-reduced-motion:reduce){.chip{animation:none}.toast{transition:none}}
</style>

<div id="app">
  <canvas id="world" aria-label="3D low-poly Stud Incremental map"></canvas>
  <div id="labels"></div>
  <div class="ui">
    <div class="brand card">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="14" width="34" height="22" rx="3" fill="#E8453C"/><rect x="3" y="30" width="34" height="6" rx="2" fill="#B8322B"/><rect x="8" y="8" width="9" height="8" rx="2" fill="#FF7A6B"/><rect x="23" y="8" width="9" height="8" rx="2" fill="#FF7A6B"/><rect x="8" y="8" width="9" height="3" rx="1.5" fill="#FFB3A8"/><rect x="23" y="8" width="9" height="3" rx="1.5" fill="#FFB3A8"/></svg>
      <div><h1>STUD INCREMENTAL</h1><p>World map · every system in the game</p></div>
    </div>
    <div class="hud" id="hud" aria-label="Currencies unlocked at this point"></div>

    <aside class="panel card" aria-label="Details">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabZone" aria-selected="true">ZONE</button>
        <button class="tab" role="tab" id="tabResets" aria-selected="false">RESET LADDER</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>

    <div class="scrub card">
      <div class="now" id="now">STACK 7<small>~67 min in</small></div>
      <input id="step" type="range" min="0" max="15" step="1" value="7" aria-label="Progression">
      <div class="btns">
        <button class="btn" id="prev" aria-label="Previous step">◀</button>
        <button class="btn primary" id="play" aria-label="Play progression">PLAY</button>
        <button class="btn" id="next" aria-label="Next step">▶</button>
      </div>
      <div class="ticks" aria-hidden="true"><span>S0</span><span>S2</span><span>S4</span><span>S6</span><span>S8</span><span>S10</span><span>REBIRTH</span><span>S12</span><span>ENDGAME</span></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="err">The 3D view needs WebGL. Try a current browser on a device with graphics acceleration.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').style.display='grid'; return; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   DATA — names from the Stud icon sheet, numbers from the balance sheet
   ===================================================================== */
const C = { studs:'#D9DDE6', bricks:'#E8453C', welds:'#8FA3C0', bp:'#2FBF5B', oofs:'#FFD23F', gems:'#8A4DFF',
  cyl:'#17B3A3', balls:'#FF3FA4', tix:'#F2B63D', glass:'#7FD6FF', glacier:'#4AA8FF', plate:'#C9D2DE',
  ff:'#B07CFF', frost:'#9FD8FF', neon:'#5BE04A', foil:'#FF8FD0', light:'#FFD84A', refl:'#BFD9FF',
  spark:'#FFB347', fog:'#B9B3E6', meteor:'#FF6A2B', loot:'#D99A2B', xp:'#58D66B', level:'#3E8BFF', stack:'#FF5B4D',
  obby:'#FF9A2E', rebirth:'#A24DFF', anchor:'#3F7BFF', union:'#34D6B0', publish:'#2FA8FF', noob:'#FFD23F', crate:'#C97B3A', tools:'#E0782A', thr:'#FF7A2B', hats:'#9B3DFF' };

// Progression steps (u index). Stack shown = max reached at that step.
const STEPS = [
  {name:'STACK 0',  t:'Just spawned', stack:0},
  {name:'STACK 1',  t:'6 s', stack:1},
  {name:'STACK 2',  t:'~1–2 min', stack:2},
  {name:'STACK 3',  t:'5.5 min', stack:3},
  {name:'STACK 4',  t:'~10 min', stack:4},
  {name:'STACK 5',  t:'~17 min', stack:5},
  {name:'STACK 6',  t:'~27 min', stack:6},
  {name:'STACK 7',  t:'~67 min', stack:7},
  {name:'STACK 8',  t:'~1.4 h', stack:8},
  {name:'STACK 9',  t:'~1.8 h', stack:9},
  {name:'STACK 10', t:'~3.1 h', stack:10},
  {name:'REBIRTH',  t:'~7.1 h · Studs > 1e2283', stack:10, rebirth:true},

  {name:'ENDGAME',  t:'Union 1000 · Publish 3', stack:13, anchor:9, end:true},
];
const STUDS_AT = ['88','4.1e5','2.2e9','8.0e14','3.3e23','6.1e39','2.0e64','2.41e152','5.5e275','3.0e977','1.1e1500','9.4e2282','4.2e3100','8.8e3400','1.9e3610','2.5e3900'];

// Currency chips: [label, color, unlock step, sample value fn]
const CUR = [
  ['Studs',C.studs,0,u=>STUDS_AT[u]],
  ['Bricks',C.bricks,1,u=>['','4.4e3','9.1e8','2.6e14','1.2e22','3.3e38','8.0e62','1.2e40','7.7e90','2.1e160','6.0e300','9.9e999','1.4e1400','3.0e1700','8.1e2000','5.0e2400'][u]],
  ['Build Points',C.bp,1,u=>['','12','3.1e3','8.8e5','4.0e8','6.2e11','9.0e14','3.1e21','7.5e40','1.1e88','5.0e140','8.1e260','9.9e500','2.2e800','6.0e1100','1.0e1500'][u]],
  ['Tix',C.tix,1,u=>['','3','41','960','2.2e4','7.7e5','1.9e7','4.4e9','9.0e11','6.2e14','3.0e18','1.1e24','8.0e40','2.2e70','5.0e110','1.0e240'][u]],
  ['Welds',C.welds,2,u=>['','','6','2.1e4','8.8e9','1.4e19','6.0e27','8.8e33','2.1e60','9.0e110','4.4e180','8.8e300','2.0e500','7.0e800','1.2e1100','4.0e1500'][u]],
  ['Oofs',C.oofs,4,u=>['','','','','930','4.0e7','1.1e14','5.5e21','2.0e40','8.8e77','3.0e130','9.0e250','1.0e400','5.0e700','7.0e900','2.0e1300'][u]],
  ['Builder Level',C.level,4,u=>['','','','','3','9','17','31','58','96','140','190','260','330','410','520'][u]],
  ['Gems',C.gems,5,u=>['','','','','','40','9.9e3','7.0e12','3.3e18','1.2e24','8.0e29','4.1e31','1.1e36','9.0e40','4.4e45','3.0e120'][u]],
  ['Cylinders',C.cyl,7,u=>['','','','','','','','850','3.0e8','9.1e19','4.0e42','8.0e90','1.0e140','3.0e200','9.0e260','1.0e300'][u]],
  ['Crates',C.crate,8,u=>['','','','','','','','','Lv 12','Lv 41','Lv 180','Lv 900','Lv 1.3e3','Lv 1.4e3','Lv 1.5e3','Lv 2.0e3'][u]],
  ['Balls',C.balls,9,u=>['','','','','','','','','','2.5e6','7.7e30','1.1e75','5.0e120','9.0e190','3.0e260','9.0e300'][u]],
  ['Glass',C.glass,11,u=>['','','','','','','','','','','','1.0','4.0e30','9.0e110','3.0e200','1.0e260'][u]],
  ['Glacier',C.glacier,11,u=>['','','','','','','','','','','','2','8.0e20','4.0e60','1.0e110','4.0e150'][u]],
  ['Diamond Plate',C.plate,12,u=>['','','','','','','','','','','','','3.0e9','8.0e25','5.0e40','2.0e60'][u]],
  ['Frost Points',C.frost,12,u=>['','','','','','','','','','','','','6.0e3','9.0e8','1.0e15','8.0e30'][u]],
  ['Force Fields',C.ff,14,u=>['','','','','','','','','','','','','','','1.1e4','9.0e12'][u]],
  ['Neon',C.neon,15,u=>'4.0e26'],
  ['Foil',C.foil,15,u=>'6.6e80'],
  ['Lighting',C.light,15,u=>'2.0e22'],
  ['Reflectance',C.refl,15,u=>'4.1e3'],
];

const HAT_PACKS = [
  ['Beginner Hats','1 Tix','Stack 1',1,'#3DA5FF'],
  ['Royal Hats','50 Tix','Stack 1',1,'#F2B63D'],
  ['Basic Hats','1e3 Bricks','Stack 3',3,'#E8453C'],
  ['Color Hats','2.5e4 Build Points','Stack 6',6,'#FF3FA4'],
  ['Nature Hats','5e27 Balls','Stack 9',9,'#3FBF4F'],
  ['Polychrome Hats','1e15 Gems','Rebirth',11,'#B07CFF'],
  ['Cryo Hats','50 Frost Points','Rebirth + Anchor III',12,'#9FD8FF'],
  ['Arctic Hats','1e6 Neon','Union 7',15,'#5BE04A'],
  ['Galactic Hats','500 Tix','Union 750',15,'#9B3DFF'],
];

const TIER_COST = [['0','100 Studs'],['1','1e6 Studs'],['2','5e9 Studs'],['3','2.5e15 Studs'],['4','7.5e23 Studs'],['5','1e40 Studs'],['6','1e65 Studs'],['7','1e153 Studs'],['8','1e276 Studs'],['9','1e978 Studs'],['10','1e52 Glass'],['11','7.5e113 Glass'],['12','1e195 Glass'],['13','hard cap']];
const ANCHORS = [['I','1e19','S11'],['II','2.5e34','S11'],['III','5e51','S11'],['IV','2.5e109','S12'],['V','7.5e136','S12'],['VI','2.5e185','S12'],['VII','1e234','S13'],['VIII','5e278','S13'],['IX','2 ⚠','S13']];
const UNION = [['1','1e43'],['2','1e50'],['3','1e55'],['4','1e60'],['5','1e65'],['6','1e70'],['7','1e85'],['8','1e95'],['9','1e105'],['10','5e178'],['11+','≈1e89 ⚠']];

const RESETS = [
  {n:'Welds · Compress', c:C.welds, g:'Bricks > 50', l:'Studs, Bricks', k:'everything else'},
  {n:'Stack', c:C.stack, g:'Studs > Stack cost (Glass from Stack 10) · not spent', l:'Studs, Bricks, Welds + upgrades, Oofs + upgrades, Noob level, Cylinders + upgrades, Crates, Thrusters, Tools, Balls + upgrades · past Stack 10 also Glass, Glacier, Diamond Plate, Neon, Force Fields, Anchors', k:'Build Points, Gems, Hats, Gem tree, Tix'},
  {n:'Obbies 1–4', c:C.obby, g:'Enter any time', l:'Stack reset set, Stack → 0, Gem tree (except 16 kept nodes), Build Points + upgrades, Gems', k:'Hats, Tix, the 16 kept nodes'},

  {n:'Anchor I–IX', c:C.anchor, g:'Glass price table · Stack 11–13', l:'Stack reset set (not Stack), Gems, Glass, Glacier, Diamond Plate, Glass upgrades, Gem tree (except 16), Neon', k:'Stack, Hats, Anchors owned'},

  {n:'Union', c:C.union, g:'Gems > Union cost · not spent', l:'Gem tree (except 16), Gems, Neon, Foil', k:'Stack, Glacier progress, Hats'},
  {n:'Publish', c:C.publish, g:'Foil > 1e23 / 7.5e36 / 1e78', l:'Gem tree (except 19), Gems, Neon, Foil, Lighting, Reflectance, Sparkles + their upgrades', k:'Union, Stack, Hats, 19 kept nodes'},
  {n:'Reflectance', c:C.refl, g:'Publish 3 · Lighting > 1e20', l:'Gem tree (except 19), Neon, Foil, Lighting + upgrades', k:'Reflectance, Publish, Union, Gems'},

/* =====================================================================
   THREE SETUP
   ===================================================================== */
const canvas = document.getElementById('world');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'}); }
catch(e){ document.getElementById('err').style.display='grid'; return; }
const DPR = Math.min(2, devicePixelRatio||1);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
// sky gradient
(function(){ const c=document.createElement('canvas'); c.width=4; c.height=256; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#3F8FE0'); gr.addColorStop(.55,'#8FC9F2'); gr.addColorStop(1,'#DDF0FF');
  g.fillStyle=gr; g.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; scene.background=t; })();
scene.fog = new THREE.Fog(0xCFE8FF, 220, 520);

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 1200);
camera.position.set(58, 118, 178);
const controls = new THREE.OrbitControls(camera, renderer.domElement);

/* ---------- materials & primitives ---------- */
const matCache = {};
function M(color, o={}){ const k=color+JSON.stringify(o); if(matCache[k]) return matCache[k];
  const m = new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(color), flatShading:true, roughness:.55, metalness:.05}, o));
  if(o.emissive) m.emissive = new THREE.Color(o.emissive);
  return matCache[k]=m; }
const GEO = { box:new THREE.BoxGeometry(1,1,1), stud:new THREE.CylinderGeometry(.32,.32,.2,10), cyl:new THREE.CylinderGeometry(.5,.5,1,12),
  ico:new THREE.IcosahedronGeometry(1,0), ico1:new THREE.IcosahedronGeometry(1,1), oct:new THREE.OctahedronGeometry(1,0), cone:new THREE.ConeGeometry(.5,1,8), sph:new THREE.SphereGeometry(1,10,8) };
function mesh(geo, mat, x=0,y=0,z=0, sx=1,sy=1,sz=1, cast=true){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.castShadow=cast; m.receiveShadow=true; return m; }
function box(w,h,d,color,x=0,y=0,z=0,o){ return mesh(GEO.box, typeof color==='string'?M(color,o):color, x,y+h/2,z, w,h,d); }
// LEGO-style brick with studs. w,d in studs, sp = stud pitch
function brick(w,d,h,color,sp=1,studs=true,o){ const g=new THREE.Group(); const mt=M(color,o);
  g.add(mesh(GEO.box, mt, 0,h/2,0, w*sp-.04, h, d*sp-.04));
  if(studs){ for(let i=0;i<w;i++) for(let j=0;j<d;j++){ const s=mesh(GEO.stud, mt, (i-(w-1)/2)*sp, h+.1*sp, (j-(d-1)/2)*sp, sp,sp,sp); s.castShadow=false; g.add(s);} }
  return g; }
function add(p,...c){ c.forEach(x=>p.add(x)); return p; }
function at(o,x,y,z){ o.position.set(x,y,z); return o; }

const anim = []; // per-frame callbacks (t, dt)

/* ---------- world: baseplate, sky, clouds ---------- */
const world = new THREE.Group(); scene.add(world);
(function baseplate(){
  const S=132, sp=2.2, n=Math.floor(S/sp);
  const base = new THREE.Group();
  base.add(mesh(GEO.box, M('#4B974B'), 0,-1.5,0, S,3,S));
  base.add(mesh(GEO.box, M('#3E7F3E'), 0,-4.2,0, S-2,2.4,S-2));
  // underside rocks
  const r=seeded(4); for(let i=0;i<22;i++){ const s=4+r()*9; const m=mesh(GEO.ico, M(r()<.5?'#6B5A48':'#7D6A55'), (r()-.5)*S*.8, -6-s*.6, (r()-.5)*S*.8, s,s*1.2,s); base.add(m);}
  const inst = new THREE.InstancedMesh(new THREE.CylinderGeometry(.62,.62,.32,8), M('#4B974B'), n*n);
  const d=new THREE.Object3D(); let k=0;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ d.position.set((i-(n-1)/2)*sp,.16,(j-(n-1)/2)*sp); d.updateMatrix(); inst.setMatrixAt(k++, d.matrix);}
  inst.receiveShadow = true; base.add(inst);
  world.add(base);
})();
function seeded(s){ return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); }

// paths (grey tiles) from hub to zones, added after zones defined
function path(x1,z1,x2,z2){ const dx=x2-x1, dz=z2-z1, L=Math.hypot(dx,dz); const g=new THREE.Group();
  const steps=Math.floor(L/4.4); for(let i=1;i<steps;i++){ const t=i/steps; const b=brick(2,2,.35,i%2?'#A3A2A5':'#B9B8BC',1.6,true); b.position.set(x1+dx*t,0,z1+dz*t); b.rotation.y=Math.atan2(dx,dz); g.add(b);} world.add(g); }

// brick clouds
(function clouds(){ const r=seeded(99);
  for(let i=0;i<14;i++){ const g=new THREE.Group(); const n=3+Math.floor(r()*4);
    for(let j=0;j<n;j++){ const b=brick(2+Math.floor(r()*3),2,1.4,'#FFFFFF',2.2,true,{roughness:.9}); b.position.set(j*3.6-(n*1.8), (j%2)*1.4, (r()-.5)*4); g.add(b);}
    const ang=r()*Math.PI*2, R=150+r()*140; g.position.set(Math.cos(ang)*R, 45+r()*50, Math.sin(ang)*R); g.traverse(o=>{o.castShadow=false});
    world.add(g); const sp=.6+r()*.8; anim.push((t,dt)=>{ g.position.x+=dt*sp; if(g.position.x>320) g.position.x=-320; }); }
})();

function zone(def, build){ const g=new THREE.Group(); build(g); g.position.set(def.x, def.y||0, def.z); if(def.ry) g.rotation.y=def.ry;

const skyMeteors=[]; (function(){ for(let i=0;i<5;i++){ const m=new THREE.Group(); m.add(mesh(GEO.ico,M('#8A3A1A',{emissive:'#FF5A10',emissiveIntensity:1.4}),0,0,0,2,2,2,false)); const tr=mesh(GEO.cone,new THREE.MeshBasicMaterial({color:0xFF9A3C,transparent:true,opacity:.55}),0,4,0,2.2,8,2.2,false); m.add(tr); m.visible=false; world.add(m); skyMeteors.push([m,i*1.7]); } })();
anim.push((t)=>skyMeteors.forEach(([m,o])=>{ if(!m.visible) return; const p=((t*.18+o/5)%1); m.position.set(-120+p*200+o*10,140-p*150,-160+o*60); m.rotation.z=-.9; }));

// paths
[[0,0,-34,22],[0,0,34,22],[0,0,-44,-8],[0,0,46,-10],[0,0,0,46],[0,0,-30,-40],[0,0,30,-40],[0,0,0,-40],[0,0,-52,34],[0,0,54,30],[0,0,-52,-34],[0,-40,0,-52],[30,-40,60,-40],[0,0,22,40]].forEach(p=>path(...p));

/* =====================================================================
   LOCK STATE, STEP LOGIC
   ===================================================================== */
const lockedMat = new THREE.MeshStandardMaterial({color:0x8A93A8, transparent:true, opacity:.38, flatShading:true, roughness:.8, depthWrite:false});
function setLocked(def, locked){ if(def.locked===locked) return; def.locked=locked;
  def.group.traverse(o=>{ if(o.isMesh){ o.material = locked ? lockedMat : o.userData.orig; o.castShadow = !locked && o.userData.cast; } if(o.isPointLight) o.visible=!locked; }); }

let step=7, stackShown=-1, playing=false, playTimer=0;
const T0=performance.now();
function applyStep(s, announce){
  const prev=step; step=s; const st=STEPS[s];
  zones.forEach(z=>setLocked(z, s < z.u));
  // hat stands individually
  hatMeshes.forEach(([h,i,stand,p])=>{ const lock=s<p[3]; stand.traverse(o=>{ if(o.isMesh) o.material = lock?lockedMat:o.userData.orig; }); });
  // stack bricks
  stackBricks.forEach((b,i)=>{ const on = i <= st.stack; if(on && !b.visible){ b.visible=true; b.userData.pop=0; } if(!on){ b.visible=false; b.scale.setScalar(.001);} });
  // studs only on top brick
  stackBricks.forEach((b,i)=>b.children.forEach((c,k)=>{ if(k>0) c.visible = i===st.stack; }));
  // anchors
  chainLinks.forEach(l=>{ l.material = (st.anchor||0) > l.userData.idx ? M('#8FC0FF',{emissive:'#3F7BFF',emissiveIntensity:1.4,metalness:.4}) : (s<12?lockedMat:M('#4A5570')); });
  if(unionShape) unionShape.scale.setScalar(st.end?1.25:1);
  skyMeteors.forEach(([m])=>m.visible = s>=10);
  // HUD
  const hud=document.getElementById('hud'); hud.innerHTML='';
  CUR.filter(c=>s>=c[2]).forEach(([n,col,u,f])=>{ const v=f(s); if(!v) return; const d=document.createElement('div'); d.className='chip'; d.style.setProperty('--c',col); d.innerHTML=`<span class="ico"></span>${n} <b>${v}</b>`; hud.appendChild(d); });
  document.getElementById('now').innerHTML = `${st.name}<small>${st.t}</small>`;
  document.getElementById('step').value=s;
  if(announce && s>prev){ const newly=zones.filter(z=>z.u===s).map(z=>z.name); toast(st.name, newly.length?('Unlocked: '+newly.join(' · ')):''); }
  if(selected) renderZone(selected);
}
let toastT; function toast(a,b){ const el=document.getElementById('toast'); el.innerHTML=`${a}${b?`<small>${b}</small>`:''}`; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1700); }

/* ---------- panel ---------- */
const pbody=document.getElementById('pbody'); let selected=null, tab='zone';
function zoneWorldPos(z){ const v=new THREE.Vector3(); z.group.getWorldPosition(v); return v; }
function renderZone(z){
  const locked = step < z.u; const need = STEPS[z.u]?.name || '';
  pbody.innerHTML = `
    <div><div class="eyebrow">${z.sub}</div><h2 class="zname" style="--zc:${z.c}">${z.name}</h2></div>
    <span class="state ${locked?'off':'on'}">${locked?('Locked · opens at '+need):'Unlocked'}</span>
    <p class="blurb">${z.blurb}</p>
    ${z.facts&&z.facts.length?`<ul class="facts">${z.facts.map(([a,b])=>`<li><span>${a}</span><span>${b}</span></li>`).join('')}</ul>`:''}
    ${z.table?`<table class="tbl"><thead><tr>${z.table.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${z.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>0&&z.table.h.length<=3&&i===1?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}
    ${z.flag?`<p class="flag">${z.flag}</p>`:''}
    <p class="hint">Drag to orbit · scroll or pinch to zoom · tap any build or label.</p>`;
}
function renderResets(){
  pbody.innerHTML = `<div><div class="eyebrow">Shallow → deep</div><h2 class="zname">Reset Ladder</h2></div>` +
    RESETS.map(r=>`<div class="rung" style="--rc:${r.c}"><h3>${r.n}</h3><span class="g">${r.g}</span><span class="l"><b>Resets</b> ${r.l}</span><span class="k"><b>Keeps</b> ${r.k}</span></div>`).join('') +
    `<p class="hint">Reset lists mirror Resets.lua. Numbers from Stud_Incremental_Balance.md.</p>`;
}
function setTab(t){ tab=t; document.getElementById('tabZone').setAttribute('aria-selected',t==='zone'); document.getElementById('tabResets').setAttribute('aria-selected',t==='resets'); t==='zone'?renderZone(selected||Zstack):renderResets(); }
document.getElementById('tabZone').onclick=()=>setTab('zone');
document.getElementById('tabResets').onclick=()=>setTab('resets');

/* ---------- camera fly ---------- */
let fly=null;
function select(z, flyTo=true){ selected=z; labels.forEach(l=>l.el.classList.toggle('sel', l.z===z)); if(tab!=='zone') setTab('zone'); else renderZone(z);
  if(flyTo){ const p=zoneWorldPos(z); const dir=camera.position.clone().sub(controls.target).normalize(); const dist = z.parent===glacier? 72 : (z.id==='hats'?80:(z.id==='stack'?60:45));
    fly={s:performance.now(), fromT:controls.target.clone(), toT:p.clone().add(new THREE.Vector3(0,3,0)), fromC:camera.position.clone(), toC:p.clone().add(dir.multiplyScalar(dist)).add(new THREE.Vector3(0,dist*.35,0))}; controls.autoRotate=false; } }

/* ---------- labels ---------- */
const labelsEl=document.getElementById('labels'); const labels=[];
zones.forEach(z=>{ const el=document.createElement('div'); el.className='lbl'; el.tabIndex=0; el.setAttribute('role','button'); el.innerHTML=`<span class="ico" style="--c:${z.c};background:${z.c}"></span>${z.name}`;
  el.addEventListener('click',()=>select(z)); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(z);} });
  labelsEl.appendChild(el); labels.push({z,el}); });
const tmpV=new THREE.Vector3();
function updateLabels(){ const w=renderer.domElement.clientWidth, h=renderer.domElement.clientHeight;
  labels.forEach(({z,el})=>{ z.group.getWorldPosition(tmpV); tmpV.y+=z.labelY; const dist=tmpV.distanceTo(camera.position); tmpV.project(camera);
    const vis = tmpV.z<1 && Math.abs(tmpV.x)<1.1 && Math.abs(tmpV.y)<1.1 && dist<300;
    el.style.display = vis?'flex':'none'; if(!vis) return;
    el.style.left=((tmpV.x*.5+.5)*w)+'px'; el.style.top=((-tmpV.y*.5+.5)*h)+'px';
    el.classList.toggle('locked', step<z.u); el.style.opacity = dist>200? .55 : 1; el.style.zIndex = String(1000-Math.round(dist)); }); }

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; controls.autoRotate=false; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>6) return;
  const r=renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,false)[0]; if(hit) select(hit.object.userData.zone); });

/* ---------- scrubber ---------- */
const slider=document.getElementById('step');
slider.addEventListener('input',e=>applyStep(+e.target.value,true));
document.getElementById('prev').onclick=()=>{ stopPlay(); applyStep(Math.max(0,step-1),false); };
document.getElementById('next').onclick=()=>{ stopPlay(); applyStep(Math.min(15,step+1),true); };
const playBtn=document.getElementById('play');
function stopPlay(){ playing=false; playBtn.textContent='PLAY'; }
playBtn.onclick=()=>{ if(playing){ stopPlay(); return; } playing=true; playBtn.textContent='PAUSE'; if(step>=15) applyStep(0,false); playTimer=0; };

/* ---------- resize & loop ---------- */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<700?55:42; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=(now-T0)/1000;
  if(!reduce) anim.forEach(f=>f(t,dt));
  // stack pop-in
  stackBricks.forEach((b,i)=>{ if(b.visible && b.userData.pop!==undefined && b.userData.pop<1){ b.userData.pop=Math.min(1,b.userData.pop+dt*(reduce?99:3.2)); const p=b.userData.pop; const e=1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2); b.scale.setScalar(Math.max(.001,e)); b.position.y=b.userData.baseY+(1-p)*6; } });
  // stack glow pulse
  if(playing){ playTimer+=dt; if(playTimer>1.6){ playTimer=0; if(step<15) applyStep(step+1,true); else stopPlay(); } }
  if(fly){ fly.t=Math.min(1,(now-fly.s)/1100); const k=fly.t<.5?2*fly.t*fly.t:1-Math.pow(-2*fly.t+2,2)/2; controls.target.lerpVectors(fly.fromT,fly.toT,k); camera.position.lerpVectors(fly.fromC,fly.toC,k); if(fly.t>=1) fly=null; }
  controls.update(); renderer.render(scene,camera); updateLabels();
  requestAnimationFrame(frame);
}
applyStep(7,false); select(Zstack,false); requestAnimationFrame(frame);
})();
</script>
