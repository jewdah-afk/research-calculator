<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peckwood Playtest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hud">
  <div id="wallet"></div>
  <div id="mapname">THE PARK</div>
  <div id="hud-right">
    <span id="speedtag"></span>
    <button class="key small" id="btn-save">Save</button>
  </div>
</header>
<main id="layout">
  <section id="stage">
    <canvas id="view"></canvas>
    <button class="arrow left" id="go-left" aria-label="Travel left">◀</button>
    <button class="arrow right" id="go-right" aria-label="Travel right">▶</button>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="help">WASD / arrows or click to move · E to buy a station · stand on the platform for seeds</div>
  </section>
  <aside id="drawer">
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/break_eternity.js@2.1.2/dist/break_eternity.min.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/systems.js"></script>
<script src="js/main.js"></script>
</body>
</html>
