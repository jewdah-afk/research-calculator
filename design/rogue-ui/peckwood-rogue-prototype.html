<title>Peckwood Rogue Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Single-screen game: full-bleed canvas, HUD floats in the corners. Deliberately one dark look. */
:root{
  --bg:#0b0d16; --ink:#0b0c10; --panel:#161b2b; --text:#f3f5fb; --muted:#9aa3ba;
  --gold:#ffc93c; --hp:#e5383b; --xp:#5be37d; --sea:#4aa3ff;
  --display:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--display);-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.left{display:flex;gap:8px;align-items:center}
.lv{width:44px;height:44px;border-radius:12px;background:linear-gradient(#fff1a8,#ffc93c 55%,#c77a12);border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--ink);box-shadow:0 0 14px #ffc93c88}
.bars{display:flex;flex-direction:column;gap:4px;width:min(42vw,220px)}
.bar{height:14px;border-radius:8px;background:#0f1115;border:2px solid var(--ink);overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .2s}
.bar b{position:absolute;inset:0;font-size:10px;font-weight:600;display:grid;place-items:center;text-shadow:0 1px 0 var(--ink)}
.timer{font-size:26px;font-weight:700;text-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.sub{font-size:12px;color:var(--muted);text-align:right;font-weight:600}
.zone{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:#161b2bcc;border:2px solid var(--ink);padding:6px 14px;border-radius:20px;font-weight:600;font-size:13px;pointer-events:none;transition:opacity .4s}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;text-shadow:0 3px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;text-align:center;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-60%)}
.bottom{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.hint{font-size:12px;color:var(--text);font-weight:600;max-width:60%;background:#161b2bcc;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}
.btn{pointer-events:auto;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(#353d50,#1c2130);border:3px solid var(--ink);border-radius:12px;padding:10px 14px;text-shadow:0 2px 0 var(--ink);cursor:pointer}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.over{position:fixed;inset:0;display:grid;place-items:center;background:#05070dcc}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:22px;text-align:center;max-width:min(92vw,360px);box-shadow:0 0 30px #b44cff55}
.card h1{margin:0 0 6px;font-size:30px;text-shadow:0 3px 0 var(--ink)}
.card p{color:var(--muted);margin:6px 0 16px;font-size:14px;line-height:1.4}
.go{background:linear-gradient(#fff1a8,#ffc93c 55%,#c77a12);font-size:18px;padding:12px 26px}
</style>

<canvas id="c" aria-label="Game view"></canvas>
<div class="hud">
  <div class="left"><div class="lv" id="lv">1</div>
    <div class="bars"><div class="bar"><i id="hpf" style="width:100%;background:linear-gradient(#ff8a7a,#e5383b)"></i><b id="hpt">100 / 100</b></div>
    <div class="bar" style="height:10px"><i id="xpf" style="width:0;background:linear-gradient(#a8f5be,#5be37d)"></i></div></div></div>
  <div><div class="timer" id="tm">0:00</div><div class="sub" id="kills">0 kills</div></div>
</div>
<div class="zone" id="zone">Meadow</div>
<div class="toast" id="toast"></div>
<div class="bottom"><div class="hint" id="hint">Drag anywhere to move. Your bird shoots by itself.</div><button class="btn" id="newworld">New world</button></div>
<div class="over" id="start"><div class="card"><h1>Peckwood Rogue</h1>
  <p>A prototype of the endless studded world. Every world is generated from a seed. Lakes are crossed by boat (slow paddling), crypts step down 0.5 per ring, and you never need to jump.</p>
  <button class="btn go" id="play">Play</button></div></div>

function toast(t,c){ const el=document.getElementById('toast'); el.textContent=t; el.style.color=c||'#fff'; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1400); }
function levelUp(){ P.lv++; P.xp-=P.need; P.need=Math.round(P.need*1.35+3);
  let roll=Math.random(), acc=0, tier=0; for(let i=RAR.length-1;i>=0;i--){ acc+=RAR[i][2]; if(roll<acc){tier=i;break;} }
  const u=UPS[Math.random()*UPS.length|0], mult=[1,1.2,1.4,1.6,2,2.5][tier];
  for(let i=0;i<Math.round(mult);i++) u[1](P); if(mult%1) u[1](P);

  for(let i=0;i<14;i++) fx.push({x:P.x,z:P.z,vx:(Math.random()-.5)*6,vz:(Math.random()-.5)*6,life:.7,c:RAR[tier][1]}); }
const player={ get x(){return P.x}, get z(){return P.z}, draw(ox,oy){ const gh=groundH(P.x,P.z), [,m]=tile(P.x,P.z), boat=m===WATER; const sx=ox+(P.x-P.z)*HW, sy=oy+(P.x+P.z)*HH-gh*PH/STEP;

function nearest(r){ let b=null, bd=r*r; for(const e of enemies){ const d=(e.x-P.x)**2+(e.z-P.z)**2; if(d<bd){bd=d;b=e;} } return b; }
function update(dt){

}
function render(){

    if(f.txt!==undefined){ cx.font='700 14px Fredoka, sans-serif'; cx.textAlign='center'; cx.lineWidth=3; cx.strokeStyle='#0b0c10'; const yy=sy-30-(0.6-f.life)*30; cx.strokeText(f.txt,sx,yy); cx.fillStyle='#ffd54a'; cx.fillText(f.txt,sx,yy); }
    else { cx.fillStyle=f.c; cx.globalAlpha=Math.max(0,f.life/0.7); cx.fillRect(sx-3,sy-20,6,6); cx.globalAlpha=1; } }

  o.querySelector('p').textContent=`You survived ${document.getElementById('tm').textContent}, reached level ${P.lv} and took down ${kills} enemies.`; document.getElementById('play').textContent='Play again'; }

document.getElementById('newworld').onclick=()=>{ SEED=(Math.random()*1e6)|0; topCache.clear(); reset(); running=true; document.getElementById('start').hidden=true; toast('New world · seed '+SEED,'#fff'); };
reset(); requestAnimationFrame(loop);
</script>
