<title>Peckwood Rogue Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* One-screen game. Canvas full-bleed; HUD floats. Deliberately one dark look. */
:root{
  --bg:#0b0d16; --ink:#0b0c10; --panel:#161b2b; --text:#f3f5fb; --muted:#aab3c8;
  --gold:#ffc93c; --hp:#e5383b; --xp:#5be37d;
  --display:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--display);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.left{display:flex;gap:8px;align-items:center;min-width:0}
.lv{flex:none;width:44px;height:44px;border-radius:12px;background:linear-gradient(#fff1a8,#ffc93c 55%,#c77a12);border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--ink);box-shadow:0 0 14px #ffc93c88}
.bars{display:flex;flex-direction:column;gap:4px;width:min(38vw,220px)}
.bar{height:14px;border-radius:8px;background:#0f1115;border:2px solid var(--ink);overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .15s}
.bar b{position:absolute;inset:0;font-size:10px;font-weight:600;display:grid;place-items:center;text-shadow:0 1px 0 var(--ink)}
.chips{display:flex;gap:6px;margin-top:2px}
.chip{font-size:11px;font-weight:700;background:#161b2bcc;border:2px solid var(--ink);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.timer{font-size:24px;font-weight:700;text-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
#mini{width:92px;height:92px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 0 0 2px #ffffff22}
.zone{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 74px);background:#161b2bd9;border:2px solid var(--ink);padding:5px 14px;border-radius:20px;font-weight:600;font-size:13px;pointer-events:none;white-space:nowrap}
.banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.9);font-size:34px;font-weight:700;text-shadow:0 4px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;text-align:center;white-space:nowrap}
.banner small{display:block;font-size:14px;color:var(--muted);text-shadow:0 2px 0 var(--ink)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:20px;font-weight:700;text-shadow:0 3px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-62%)}
.bottom{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.slots{display:flex;gap:6px}
.slot{width:40px;height:40px;border-radius:10px;background:#161b2bd9;border:3px solid var(--r,#3a4258);display:grid;place-items:center;position:relative}
.slot img{width:30px;height:30px}
.slot em{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:10px;font-weight:700;background:#4aa3ff;border:2px solid var(--ink);border-radius:8px;padding:0 4px}
.btn{pointer-events:auto;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(#353d50,#1c2130);border:3px solid var(--ink);border-radius:12px;padding:9px 13px;text-shadow:0 2px 0 var(--ink);cursor:pointer}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gold{background:linear-gradient(#fff1a8,#ffc93c 55%,#c77a12)}
.over{position:fixed;inset:0;display:grid;place-items:center;background:#05070dd0;padding:16px}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:22px;text-align:center;max-width:min(92vw,380px);box-shadow:0 0 30px #b44cff55}
.card h1{margin:0 0 6px;font-size:30px;text-shadow:0 3px 0 var(--ink);text-wrap:balance}
.card p{color:var(--muted);margin:6px 0 16px;font-size:14px;line-height:1.45}
.go{font-size:18px;padding:12px 26px}
.pick{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(96vw,640px)}
.pick h2{margin:0;font-size:36px;color:#ffd54a;text-shadow:0 4px 0 var(--ink),0 0 24px #ff8a1c;letter-spacing:.02em}
.cards{display:flex;gap:10px;width:100%;justify-content:center}
.up{flex:1 1 0;min-width:0;max-width:200px;background:#141826;border:3px solid var(--r);border-radius:16px;padding:0 0 10px;cursor:pointer;color:#fff;font-family:var(--display);box-shadow:0 0 18px var(--r);transform:translateY(30px) rotate(-6deg);opacity:0;animation:deal .32s cubic-bezier(.3,1.5,.5,1) forwards}
.up:nth-child(2){animation-delay:.07s}.up:nth-child(3){animation-delay:.14s}
.up:focus-visible{outline:3px solid #fff}
.up header{background:var(--r);border-radius:12px 12px 0 0;padding:5px;font-weight:700;font-size:13px;text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
.up img{width:56px;height:56px;margin:10px auto 4px;display:block}
.up b{display:block;font-size:15px;padding:0 6px}
.up span{display:block;font-size:12px;color:#c9d0de;padding:2px 8px;font-weight:500;line-height:1.3}
.up i{display:block;font-style:normal;font-size:12px;font-weight:700;color:#5be37d;margin-top:4px}
@keyframes deal{to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.up{animation:none;opacity:1;transform:none}}
</style>

<canvas id="c" aria-label="Game view"></canvas>
<div class="hud">
  <div class="left"><div class="lv" id="lv">1</div>
    <div><div class="bars"><div class="bar"><i id="hpf" style="width:100%;background:linear-gradient(#ff8a7a,#e5383b)"></i><b id="hpt">100 / 100</b></div>
    <div class="bar" style="height:9px"><i id="xpf" style="width:0;background:linear-gradient(#a8f5be,#5be37d)"></i></div></div>
    <div class="chips"><span class="chip" id="goldc">0 gold</span><span class="chip" id="killc">0 kills</span></div></div></div>
  <div class="right"><div class="timer" id="tm">0:00</div><canvas id="mini" width="92" height="92" aria-label="Minimap"></canvas></div>
</div>
<div class="zone" id="zone">Meadow</div>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"></div>
<div class="bottom"><div class="slots" id="slots"></div><button class="btn" id="newworld">New world</button></div>
<div class="over" id="pickov" hidden><div class="pick"><h2>LEVEL UP!</h2><div class="cards" id="cards"></div><button class="btn" id="reroll">Reroll · 2</button></div></div>
<div class="over" id="start"><div class="card"><h1>Peckwood Rogue</h1>
  <p>An endless studded world, generated from a seed. Six biomes, pyramids, crypts, villages, graveyards, ice forts, docks and lava forges. Paddle across lakes, slide on ice, avoid lava. Night brings cursed enemies.</p>
  <button class="btn gold go" id="play">Play</button></div></div>

    const c=chunkAt(Math.floor(P.x/CH),Math.floor(P.z/CH)); for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){ const ch=chunks.get((Math.floor(P.x/CH)+a)+','+(Math.floor(P.z/CH)+b)); if(!ch)continue;
      for(const p of ch.props){ if(p.kind!=='chest'&&p.kind!=='shrine')continue; if(p.open||p.used)continue; const X=p.x-P.x+S, Y=p.z-P.z+S; if(X<0||Y<0||X>92||Y>92)continue; mg.fillStyle=p.kind==='chest'?'#b44cff':'#ffc93c'; mg.fillRect(X-2,Y-2,4,4); } }
    mg.fillStyle='#fff'; mg.strokeStyle='#0b0c10'; mg.beginPath(); mg.arc(S,S,3,0,7); mg.fill(); mg.stroke(); } }
let last=0; function loop(t){ const dt=Math.min(.05,(t-last)/1000||0); last=t; if(running&&!paused) update(dt); render(); requestAnimationFrame(loop); }
function gameOver(){ running=false; const o=document.getElementById('start'); o.hidden=false; o.querySelector('h1').textContent='Run over';
  o.querySelector('p').textContent=`You survived ${document.getElementById('tm').textContent}, reached level ${P.lv}, earned ${gold} gold and took down ${kills} enemies.`; document.getElementById('play').textContent='Play again'; }
document.getElementById('play').onclick=()=>{ reset(); document.getElementById('start').hidden=true; running=true; paused=false; };
document.getElementById('newworld').onclick=()=>{ SEED=(Math.random()*1e6)|0; reset(); running=true; paused=false; document.getElementById('start').hidden=true; document.getElementById('pickov').hidden=true; toast('New world · seed '+SEED,'#fff'); };
reset(); requestAnimationFrame(loop);
window.dbg={get P(){return P}, biomeAt, tp(x,z){P.x=x;P.z=z;}, setT(t){time=t;}};
</script>
