<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level-up pick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#ffd23f}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #1d1b2c; font-family: 'Nunito', sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 48px; box-sizing: border-box; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Lilita One', sans-serif; font-size: 64px; line-height: 1; color: #ffd23f; -webkit-text-stroke: 4px #0e0d18; paint-order: stroke fill">LEVEL UP!</div>
<div style="font-weight: 900; font-size: 16px; color: #c8c4dc">Pick one · +2 more waiting</div>
</div>
<div style="display: flex; gap: 28px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<button style="{{c.frame}}">
<div style="{{c.band}}">{{c.rarity}}</div>
<div style="width: 112px; height: 112px; border-radius: 24px; background: #2b2740; border: 4px solid #0e0d18; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 34px; color: #fff">{{c.glyph}}</div>
<div style="font-family: 'Lilita One', sans-serif; font-size: 28px; color: #fff">{{c.name}}</div>
<div style="font-weight: 900; font-size: 14px; color: #ffd23f; background: #0e0d18; padding: 3px 12px; border-radius: 999px">{{c.tag}}</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 100%">
<sc-for list="{{c.lines}}" as="l" hint-placeholder-count="2">
<div style="display: flex; justify-content: space-between; background: #0e0d1888; border-radius: 10px; padding: 8px 12px; font-weight: 900; font-size: 16px"><span>{{l.k}}</span><span style="color: #5be37d">{{l.v}}</span></div>
</sc-for>
</div>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 16px">
<button style="height: 56px; padding: 0 26px; border-radius: 14px; background: #4aa3ff; border: 4px solid #0e0d18; box-shadow: 0 5px 0 #0e0d18; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #0e0d18; cursor: pointer">REROLL · 3</button>
<button style="height: 56px; padding: 0 26px; border-radius: 14px; background: #e5484d; border: 4px solid #0e0d18; box-shadow: 0 5px 0 #0e0d18; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #fff; cursor: pointer">BANISH · 2</button>
<button style="height: 56px; padding: 0 26px; border-radius: 14px; background: #9aa0ab; border: 4px solid #0e0d18; box-shadow: 0 5px 0 #0e0d18; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #0e0d18; cursor: pointer">SKIP · 1</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const R = { common: '#9aa0ab', uncommon: '#5be37d', rare: '#4aa3ff', epic: '#b44cff', legendary: '#ffb23f' };
const mk = (rarity, glyph, name, tag, lines) => ({
rarity: rarity.toUpperCase(), glyph, name, tag, lines,
frame: 'width: 300px; height: 440px; border-radius: 24px; background: #2b2740; border: 6px solid ' + R[rarity] + '; box-shadow: 0 8px 0 #0e0d18, 0 0 32px ' + R[rarity] + '55; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 18px 18px; box-sizing: border-box; overflow: hidden; cursor: pointer; font-family: inherit; color: inherit',
band: 'width: calc(100% + 36px); padding: 8px 0; background: ' + R[rarity] + '; color: #0e0d18; font-family: Lilita One, sans-serif; font-size: 20px; text-align: center',
});
return { cards: [
mk('rare', 'PS', 'Parrot Strike', 'LV 4 → 5', [{ k: 'Damage', v: '+2.8' }, { k: 'Size', v: '+28%' }]),
mk('legendary', 'CD', 'Cooldown Tome', 'LV 2 → 3', [{ k: 'Cooldown', v: '+15%' }]),
mk('common', 'KP', 'Kernel Pop', 'NEW', [{ k: 'Damage', v: '6' }, { k: 'Size', v: '100%' }]),
] };
}
}
</script>
</body>
</html>
