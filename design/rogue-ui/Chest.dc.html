<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chest reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#ffd23f}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 1280px; height: 720px; background: #1d1b2c; font-family: 'Nunito', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; gap: 64px">
<div style="width: 420px; display: flex; flex-direction: column; align-items: center; gap: 20px">
<div style="font-family: 'Lilita One', sans-serif; font-size: 52px; color: #ffb23f; -webkit-text-stroke: 4px #0e0d18; paint-order: stroke fill">LEGENDARY!</div>
<div style="width: 340px; border-radius: 26px; background: #2b2740; border: 6px solid #ffb23f; box-shadow: 0 8px 0 #0e0d18, 0 0 60px #ffb23f88; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 22px; box-sizing: border-box">
<div style="width: 128px; height: 128px; border-radius: 28px; background: #0e0d18; display: flex; align-items: center; justify-content: center">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffb23f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
</div>
<div style="font-family: 'Lilita One', sans-serif; font-size: 30px">Storm Locket</div>
<div style="font-weight: 900; font-size: 16px; text-align: center; color: #d8d4ea">Every 6th hit chains 90% damage to 2 nearby enemies.</div>
<div style="font-weight: 900; font-size: 14px; color: #5be37d">+10% Damage · +10% Attack speed</div>
</div>
<div style="display: flex; gap: 14px">
<button style="height: 56px; padding: 0 30px; border-radius: 14px; background: #ffd23f; border: 4px solid #0e0d18; box-shadow: 0 5px 0 #0e0d18; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #0e0d18">TAKE</button>
<button style="height: 56px; padding: 0 30px; border-radius: 14px; background: #e5484d; border: 4px solid #0e0d18; box-shadow: 0 5px 0 #0e0d18; font-family: 'Lilita One', sans-serif; font-size: 22px; color: #fff">BANISH</button>
</div>
</div>
<div style="width: 340px; border-radius: 22px; background: #2b2740; border: 4px solid #0e0d18; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="font-family: 'Lilita One', sans-serif; font-size: 24px">Shrine: Charging</div>
<div style="height: 18px; background: #0e0d18; border-radius: 6px; padding: 3px; box-sizing: border-box"><div style="width: 58%; height: 100%; background: #7fd3ff; border-radius: 4px"></div></div>
<div style="font-weight: 900; font-size: 14px; color: #d8d4ea">Stand inside the ring until full.</div>
<div style="font-family: 'Lilita One', sans-serif; font-size: 20px; margin-top: 8px">Banished this run</div>
<div style="display: flex; gap: 8px">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #0e0d18; border: 3px solid #e5484d; opacity: 0.7"></div>
<div style="width: 44px; height: 44px; border-radius: 10px; background: #0e0d18; border: 3px solid #e5484d; opacity: 0.7"></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
